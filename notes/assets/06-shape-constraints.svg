<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img"><title>融合前先检查接口：哪些维度需要相同</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="390" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">融合前先检查接口：哪些维度需要相同</text><rect x="35" y="100" width="470" height="111" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="49" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加</text><text x="49" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C×H×W  +  C×H×W</text><text x="49" y="183" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">得到 C×H×W</text><rect x="565" y="100" width="500" height="111" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="579" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">沿通道拼接</text><text x="579" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C₁×H×W  与  C₂×H×W</text><text x="579" y="183" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">得到 (C₁+C₂)×H×W</text><rect x="120" y="260" width="860" height="57" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="134" y="289" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">空间尺寸不同 → 上采样或下采样；相加时通道不同 → 先变换通道。</text><text x="35" y="370" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">同形状仍需检查坐标对应关系；不能把不相干位置当作同一位置融合。</text></svg>