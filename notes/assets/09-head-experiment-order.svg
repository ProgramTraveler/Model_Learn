<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280"><rect width="1100" height="280" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">每组对照回答一个主要设计问题</text><rect x="25" y="75" width="225" height="120" rx="12" fill="#e3edfc"/><text x="37" y="108" font-size="21">A：基线</text><text x="37" y="146" font-size="20">全局平均</text><text x="37" y="179" font-size="20">Linear → 2</text><rect x="300" y="75" width="225" height="120" rx="12" fill="#e3edfc"/><text x="312" y="108" font-size="21">B：池化候选</text><text x="312" y="146" font-size="20">2×2平均</text><text x="312" y="179" font-size="20">Linear → 2</text><rect x="575" y="75" width="225" height="120" rx="12" fill="#e3edfc"/><text x="587" y="108" font-size="21">C：MLP候选</text><text x="587" y="146" font-size="20">2×2平均</text><text x="587" y="179" font-size="20">MLP：d=32</text><rect x="850" y="75" width="225" height="120" rx="12" fill="#e3edfc"/><text x="862" y="108" font-size="21">D：宽度候选</text><text x="862" y="146" font-size="20">2×2平均</text><text x="862" y="179" font-size="20">MLP：d=128</text><text x="263" y="143" font-size="23">→</text><text x="538" y="143" font-size="23">→</text><text x="813" y="143" font-size="23">→</text><text x="25" y="243" font-size="20">A/B看空间汇总；B/C看分类器；C/D看宽度。候选并非必走的升级路线。</text></g></svg>