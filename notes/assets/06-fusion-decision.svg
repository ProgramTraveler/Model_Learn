<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img"><title>单层与多层方案：把收益和成本放在一起评估</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="400" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">单层与多层方案：把收益和成本放在一起评估</text><rect x="35" y="95" width="480" height="111" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">单层输出基线</text><text x="49" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">最后一层 → head</text><text x="49" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">接口简单；head 无法直接读取浅层</text><rect x="565" y="95" width="500" height="111" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="579" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">多层融合候选</text><text x="579" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">多层 → neck → head</text><text x="579" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">直接利用多层；增加计算、内存与复杂度</text><path d="M275 210 L465 275" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M815 210 L635 275" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="325" y="285" width="460" height="57" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="339" y="314" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">在相同评估条件下比较效果与成本</text><text x="35" y="380" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">信息来源更多只是设计动机；是否改善窄道分类仍需对照实验。</text></svg>