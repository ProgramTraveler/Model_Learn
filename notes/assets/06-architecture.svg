<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img"><title>模型模块职责与省去独立 neck 的分类结构</title><rect width="960" height="350" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172033"><text x="480" y="35" font-size="23">先按职责理解结构</text><rect x="20" y="65" width="180" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="110" y="100" font-size="21">图片</text><text x="110" y="132" font-size="18">原始输入</text><text x="212" y="116" font-size="25">→</text><rect x="225" y="65" width="180" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="315" y="100" font-size="21">Backbone</text><text x="315" y="132" font-size="18">提取特征</text><text x="417" y="116" font-size="25">→</text><rect x="455" y="65" width="180" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="545" y="100" font-size="21">Neck</text><text x="545" y="132" font-size="18">组织、融合特征</text><text x="647" y="116" font-size="25">→</text><rect x="685" y="65" width="180" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="775" y="100" font-size="21">Head</text><text x="775" y="132" font-size="18">输出分类分数</text><text x="480" y="202" font-size="21">整图分类的一种结构：省去独立 Neck</text><rect x="160" y="228" width="640" height="65" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="480" y="269" font-size="22">图片 → Backbone → 分类 Head → 两个类别分数</text><text x="480" y="328" font-size="17">是否增加特征融合，应由任务需要与实验结果决定</text></g></svg>