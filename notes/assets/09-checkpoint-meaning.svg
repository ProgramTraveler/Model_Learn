<svg xmlns="http://www.w3.org/2000/svg" width="950" height="230" viewBox="0 0 950 230"><rect width="950" height="230" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">结构相同，训练更新使参数状态变化</text><rect x="25" y="65" width="390" height="110" rx="12" fill="#e3edfc"/><rect x="535" y="65" width="390" height="110" rx="12" fill="#e3edfc"/><text x="45" y="100" font-size="22">第 18 轮：保存状态 A</text><text x="45" y="143" font-size="21">checkpoint A → 加载后评估</text><text x="440" y="121" font-size="23">→</text><text x="535" y="200" font-size="18">继续训练，权重等状态更新</text><text x="555" y="100" font-size="22">第 25 轮：保存状态 B</text><text x="555" y="143" font-size="21">checkpoint B → 加载后评估</text></g></svg>