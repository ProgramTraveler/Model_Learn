<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img"><title>逐元素相加：对应通道、对应格子相加</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="360" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">逐元素相加：对应通道、对应格子相加</text><text x="45" y="106" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><rect x="45" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="85" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="45" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="85" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><text x="195" y="175" font-size="30" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">+</text><text x="265" y="106" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B′</text><rect x="265" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="274.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="305" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="314.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="265" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="274.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="305" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="314.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><path d="M375 165 L485 165" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="535" y="106" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出：1×2×2</text><rect x="535" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="544.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">11</text><rect x="575" y="120" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="584.2" y="146.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">12</text><rect x="535" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="544.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">13</text><rect x="575" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="584.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">14</text><rect x="745" y="115" width="300" height="111" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="759" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">仍然是一张表</text><text x="759" y="171" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1+10=11，2+10=12</text><text x="759" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">和不能唯一还原输入</text><text x="35" y="340" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加本身没有学习参数；两路通道数不同时，需要先进行通道变换。</text></svg>