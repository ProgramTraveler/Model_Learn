<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="24">训练前约定 checkpoint 选择规则</text><rect x="25" y="60" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="89" font-size="19">验证集：筛选满足预定误报上限的 checkpoint</text><rect x="25" y="117" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="146" font-size="19">满足条件者：选窄道召回最高者</text><rect x="25" y="174" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="203" font-size="19">并列：按预先约定的次要指标选择</text><rect x="25" y="231" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="260" font-size="19">无满足条件者：记录未达标，不临时放宽</text><rect x="25" y="288" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="317" font-size="19">所有方案与种子统一规则；测试集留到最终评价</text></g></svg>