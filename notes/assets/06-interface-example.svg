<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img"><title>接口示例：192 通道拼接，或 64 通道相加</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="490" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">接口示例：192 通道拼接，或 64 通道相加</text><rect x="35" y="95" width="360" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">浅层：64×40×40</text><text x="49" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">深层：128×20×20</text><path d="M395 140 L470 140" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="485" y="95" width="570" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="499" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">深层上采样 → 128×40×40</text><text x="499" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">先对齐 H、W；浅层保持 64×40×40</text><path d="M710 180 L300 260" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M800 180 L800 260" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="35" y="275" width="475" height="111" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="49" y="304" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">沿通道拼接</text><text x="49" y="331" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64 + 128 = 192</text><text x="49" y="358" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 192×40×40</text><rect x="565" y="275" width="490" height="111" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="579" y="304" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">深层 1×1 卷积：128 → 64；再相加</text><text x="579" y="331" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×40×40 + 64×40×40</text><text x="579" y="358" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 64×40×40</text><text x="35" y="470" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">假设两路空间坐标已对齐；通道目标与操作顺序是设计选择。</text></svg>