<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="265" viewBox="0 0 1000 265"><rect width="1000" height="265" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">输入输出由接口确定，隐藏宽度通过实验选择</text><rect x="25" y="70" width="455" height="120" rx="12" fill="#e3edfc"/><rect x="520" y="70" width="455" height="120" rx="12" fill="#e1f3e9"/><text x="45" y="111" font-size="23">5120 → 32 → SiLU → 2</text><text x="45" y="155" font-size="22">163,938个参数</text><text x="540" y="111" font-size="23">5120 → 128 → SiLU → 2</text><text x="540" y="155" font-size="22">655,746个参数</text><text x="25" y="233" font-size="20">教学候选：比较验证收益、重复稳定性和成本；宽度越大不保证越好。</text></g></svg>