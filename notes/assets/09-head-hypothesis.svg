<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">同一份卷积后特征：比较两种空间汇总</text><rect x="25" y="65" width="455" height="145" rx="12" fill="#e3edfc"/><rect x="520" y="65" width="455" height="145" rx="12" fill="#e1f3e9"/><text x="45" y="101" font-size="22">A：每个通道整张求平均</text><text x="45" y="142" font-size="21">每通道 1 个数 → 共 1280 个数</text><text x="45" y="182" font-size="21">Linear(1280, 2)</text><text x="540" y="101" font-size="22">B：每通道分成 2×2 个区域</text><text x="540" y="142" font-size="21">每通道 4 个数 → 共 5120 个数</text><text x="540" y="182" font-size="21">Linear(5120, 2)</text><text x="25" y="252" font-size="20">B保留粗略分区，仍压缩区内信息；两种head分别训练后比较。</text></g></svg>