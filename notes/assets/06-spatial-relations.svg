<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img"><title>窄道线索：障碍物存在，还要看间隙关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="490" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">窄道线索：障碍物存在，还要看间隙关系</text><text x="45" y="95" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">场景 A：较大间隙</text><rect x="45" y="125" width="460" height="180" rx="12" fill="#edf2f7" stroke="#94a7bd"/><rect x="65" y="150" width="125.0" height="125" rx="12" fill="#d7e0ec" stroke="#94a7bd"/><text x="80" y="179" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">左障碍物</text><rect x="360.0" y="150" width="125.0" height="125" rx="12" fill="#d7e0ec" stroke="#94a7bd"/><text x="375.0" y="179" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">右障碍物</text><path d="M195.0 215 L355.0 215" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580" y="95" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">场景 B：较小间隙</text><rect x="580" y="125" width="460" height="180" rx="12" fill="#edf2f7" stroke="#94a7bd"/><rect x="600" y="150" width="180.0" height="125" rx="12" fill="#d7e0ec" stroke="#94a7bd"/><text x="615" y="179" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">左障碍物</text><rect x="840.0" y="150" width="180.0" height="125" rx="12" fill="#d7e0ec" stroke="#94a7bd"/><text x="855.0" y="179" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">右障碍物</text><path d="M785.0 215 L835.0 215" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="355" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两边都有障碍物，仅识别“出现了障碍物”不足以区分这两种布局。</text><rect x="40" y="385" width="1020" height="70" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="55" y="414" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">局部边界响应 → 多层空间组合 → 与间隙布局有关的表示 → 分类 head</text><text x="40" y="480" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">仅示意同一距离处的布局；不表示真实尺度，也不是由像素间距直接判断可通行性。</text></svg>