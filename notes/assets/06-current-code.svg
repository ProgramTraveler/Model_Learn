<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img"><title>当前训练代码：特征提取与分类输出</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="410" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">当前训练代码：特征提取与分类输出</text><rect x="30" y="110" width="175" height="125" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="45" y="139" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图片</text><text x="45" y="166" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3×64×64</text><rect x="245" y="110" width="240" height="125" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="260" y="139" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">卷积 → ReLU</text><text x="260" y="166" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">→ 局部最大池化</text><text x="260" y="193" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8×32×32</text><rect x="525" y="110" width="210" height="125" rx="12" fill="#fff0d9" stroke="#94a7bd"/><text x="540" y="139" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Flatten</text><text x="540" y="166" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8192 个数</text><rect x="775" y="110" width="290" height="125" rx="12" fill="#eee7fa" stroke="#94a7bd"/><text x="790" y="139" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Linear(8192,2)</text><text x="790" y="166" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个原始类别分数</text><path d="M205 170 L237 170" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M485 170 L517 170" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735 170 L767 170" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="295" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">卷积、激活、池化承担特征提取职责；Flatten 和 Linear 承担分类输出职责。</text><text x="35" y="335" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">省略批次维度 N；当前代码没有独立 neck。Flatten 保留数值，按固定顺序展开。</text></svg>