<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><title>前五篇知识如何支持整体架构阅读</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="430" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">前五篇知识如何支持整体架构阅读</text><rect x="35" y="90" width="320" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">01 结构与参数</text><text x="49" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">哪些量由设计设定？</text><rect x="385" y="90" width="320" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="399" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">02 激活函数</text><text x="399" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">非线性组合在哪里？</text><rect x="735" y="90" width="320" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="749" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">03 特征表示</text><text x="749" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">传递哪些数值表？</text><rect x="100" y="220" width="340" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="114" y="249" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">04 卷积与特征图</text><text x="114" y="276" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C、H、W 怎样变化？</text><rect x="665" y="220" width="340" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="679" y="249" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">05 感受野</text><text x="679" y="276" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">单个位置依赖多大范围？</text><rect x="395" y="325" width="310" height="57" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="409" y="354" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">06：模块职责、接口与取舍</text><path d="M190 174 L530 320" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M540 174 L530 320" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M890 174 L530 320" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M440 262 L480 320" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M665 262 L620 320" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="35" y="410" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图中是知识依赖关系；不是模型计算顺序。</text></svg>