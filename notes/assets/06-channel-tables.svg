 fill="#e0edff" stroke="#91a5bf"/><text x="190" y="242" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><text x="115" y="90" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道 1</text><rect x="115" y="105" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="127" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">a</text><rect x="159" y="105" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="171" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">b</text><rect x="203" y="105" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="215" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="115" y="149" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="127" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">c</text><rect x="159" y="149" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="171" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">d</text><rect x="203" y="149" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="215" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="115" y="193" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="127" y="222" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="159" y="193" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="171" y="222" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="203" y="193" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="215" y="222" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="360" y="105" width="670" height="120" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="375" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">256×20×20 = 256 张表，每张 20 行、20 列</text><text x="375" y="161" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每个格子存一个数；总共 102,400 个特征数值</text><text x="375" y="188" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图中仅画 3 张小表，省略其余通道与格子</text><rect x="360" y="270" width="670" height="115" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="375" y="299" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">固定同一行、同一列，从 256 张表各取一个数</text><text x="375" y="326" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">得到这个空间位置的 256 个分量</text><text x="375" y="353" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">这是换一个观察角度，没有求和，也没有把整张表压成一个数</text><path d="M270 180 L345 180" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/></svg>