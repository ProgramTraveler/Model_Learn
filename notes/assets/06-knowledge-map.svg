<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><title>前五篇知识如何支持整体架构阅读</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780" /></marker></defs><rect width="1100" height="430" fill="#f7f9fc" /><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">前五篇知识如何支持整体架构阅读</text><text x="35" y="410" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图中是知识依赖关系；不是模型计算顺序。</text><rect x="35" y="65" width="480" height="52" rx="8" fill="#e3edfc" stroke="#96a9be" /><text font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="50" y="97">01 结构与参数：区分设计设定与学习权重</text><path stroke-width="2" marker-end="url(#a)" d="M515 91 L685 180" fill="none" stroke="#526780" /><rect x="35" y="129" width="480" height="52" rx="8" fill="#e3edfc" stroke="#96a9be" /><text font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="50" y="161">02 激活函数：理解非线性计算</text><path stroke-width="2" marker-end="url(#a)" d="M515 155 L685 208" fill="none" stroke="#526780" /><rect x="35" y="193" width="480" height="52" rx="8" fill="#e3edfc" stroke="#96a9be" /><text font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="50" y="225">03 特征表示：读懂数值表与通道</text><path stroke-width="2" marker-end="url(#a)" d="M515 219 L685 236" fill="none" stroke="#526780" /><rect x="35" y="257" width="480" height="52" rx="8" fill="#e3edfc" stroke="#96a9be" /><text font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="50" y="289">04 卷积与特征图：核对 C、H、W 的变化</text><path stroke-width="2" marker-end="url(#a)" d="M515 283 L685 264" fill="none" stroke="#526780" /><rect x="35" y="321" width="480" height="52" rx="8" fill="#e3edfc" stroke="#96a9be" /><text font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="50" y="353">05 感受野：分析单点信息覆盖范围</text><path stroke-width="2" marker-end="url(#a)" d="M515 347 L685 292" fill="none" stroke="#526780" /><rect x="690" y="145" width="370" height="200" rx="8" fill="#e1f2eb" stroke="#96a9be" /><text font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="710" y="185">06：整体架构与模块职责</text><text font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="710" y="235">模块怎样组织？</text><text font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="710" y="275">输入输出能否衔接？</text><text font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif" x="710" y="315">怎样比较设计取舍？</text></svg>