<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270"><rect width="1120" height="270" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="35" font-size="23">当前 NarrowLaneBinaryHead：特征加工 → 空间汇总 → 分类</text><rect x="25" y="75" width="245" height="105" rx="10" fill="#e1f2eb"/><text x="37" y="110" font-size="20">P5 特征</text><text x="37" y="148" font-size="18">B×256×H×W</text><text x="275" y="135" font-size="24">→</text><rect x="300" y="75" width="245" height="105" rx="10" fill="#e1f2eb"/><text x="312" y="110" font-size="20">1×1 Conv 模块</text><text x="312" y="148" font-size="18">256 → 1280 通道</text><text x="550" y="135" font-size="24">→</text><rect x="575" y="75" width="245" height="105" rx="10" fill="#e1f2eb"/><text x="587" y="110" font-size="20">全局平均 + 展平</text><text x="587" y="148" font-size="18">B×1280</text><text x="825" y="135" font-size="24">→</text><rect x="850" y="75" width="245" height="105" rx="10" fill="#e1f2eb"/><text x="862" y="110" font-size="20">Dropout + Linear</text><text x="862" y="148" font-size="18">B×2 类别分数</text><text x="25" y="220" font-size="17">绿色部分均在 Head 范围内（P5 是输入）；参数按实际子模块参与训练。Dropout 当前 p=0。</text><text x="25" y="249" font-size="16">Conv 配置 SiLU、BN；包装器内部顺序和默认步长须核验 Conv 源码。H、W 以实际投影器输出为准。</text></g></svg>