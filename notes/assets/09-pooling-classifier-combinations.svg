<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">同一个改动，在不同组合下可能有不同收益</text><text x="310" y="82" font-size="22">单Linear</text><text x="680" y="82" font-size="22">MLP（同一隐藏宽度d）</text><text x="25" y="145" font-size="22">全局平均</text><text x="25" y="235" font-size="22">2×2分区平均</text><rect x="210" y="100" width="340" height="65" rx="10" fill="#e3edfc"/><rect x="610" y="100" width="365" height="65" rx="10" fill="#e1f3e9"/><rect x="210" y="190" width="340" height="65" rx="10" fill="#e3edfc"/><rect x="610" y="190" width="365" height="65" rx="10" fill="#e1f3e9"/><text x="230" y="141" font-size="21">A：1280 → 2</text><text x="630" y="141" font-size="21">E：1280 → d → 激活 → 2</text><text x="230" y="231" font-size="21">B：5120 → 2</text><text x="630" y="231" font-size="21">C：5120 → d → 激活 → 2</text><text x="570" y="141" font-size="23">↔</text><text x="570" y="231" font-size="23">↔</text><text x="25" y="303" font-size="19">分别看A/E与B/C；固定d不等于参数量相同，仍需同时记录成本。</text></g></svg>