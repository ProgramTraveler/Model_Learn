<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">固定分区表示，再单独比较分类器</text><rect x="25" y="70" width="455" height="135" rx="12" fill="#e3edfc"/><rect x="520" y="70" width="455" height="135" rx="12" fill="#e1f3e9"/><text x="45" y="107" font-size="22">B：5120个区域特征</text><text x="45" y="148" font-size="21">→ Linear(5120, 2)</text><text x="45" y="184" font-size="19">按区域、通道直接加权分类</text><text x="540" y="107" font-size="22">C：同样5120个区域特征</text><text x="540" y="148" font-size="20">→ Linear(5120, d) → SiLU</text><text x="540" y="184" font-size="20">→ Linear(d, 2)</text><text x="25" y="251" font-size="21">B/C只比较分类器；d是设计选择，新增能力仍需实验验证。</text></g></svg>