<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img"><title>Neck 的四个操作：每一步负责不同的变化</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="610" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Neck 的四个操作：每一步负责不同的变化</text><rect x="35" y="95" width="500" height="180" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">① 1×1 卷积</text><text x="55" y="173" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×20×20</text><path d="M265 167 L335 167" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="350" y="173" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×20×20</text><text x="55" y="230" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">学习通道组合；H、W 不变</text><rect x="565" y="95" width="500" height="180" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="579" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">② 上采样</text><text x="585" y="173" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×20×20</text><path d="M795 167 L865 167" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="880" y="173" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×40×40</text><text x="585" y="230" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">调整 H、W；C 不变</text><rect x="35" y="330" width="500" height="180" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="49" y="359" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">③ 通道拼接</text><text x="55" y="408" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两路 64×40×40</text><path d="M265 402 L335 402" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="350" y="408" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×40×40</text><text x="55" y="465" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留两组表；没有学习权重</text><rect x="565" y="330" width="500" height="180" rx="8" fill="#eee7fa" stroke="#96a9be"/><text x="579" y="359" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">④ 3×3 卷积</text><text x="585" y="408" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×40×40</text><path d="M795 402 L865 402" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="880" y="408" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×40×40</text><text x="585" y="465" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">组合所有输入通道与邻域</text><text x="35" y="590" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">① 减少通道是成本选择，非拼接必要条件；④ 设置 stride=1、padding=1。</text></svg>