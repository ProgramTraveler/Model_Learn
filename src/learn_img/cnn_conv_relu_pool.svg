<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">CNN 中 Conv2d、ReLU 与 MaxPool2d 的数据处理流程</title>
  <desc id="desc">展示一个 RGB 图片批次经过三乘三卷积、ReLU 和二乘二最大池化后的形状变化。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="convGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="reluGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="poolGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .card-title { font-size: 23px; font-weight: 700; fill: #ffffff; }
      .card-code { font-size: 17px; font-weight: 600; fill: #ffffff; }
      .body { font-size: 17px; fill: #334155; }
      .shape { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 14px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#background)"/>

  <text x="700" y="55" text-anchor="middle" class="font title">Conv2d → ReLU → MaxPool2d</text>
  <text x="700" y="87" text-anchor="middle" class="font subtitle">一批 64×64 RGB 图片如何变成尺寸更小的 8 张特征图</text>

  <!-- 输入图片 -->
  <g transform="translate(45 145)" filter="url(#shadow)">
    <rect width="250" height="430" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="250" height="72" rx="20" fill="#0f172a"/>
    <rect y="52" width="250" height="20" fill="#0f172a"/>
    <text x="125" y="35" text-anchor="middle" class="font card-title">输入图片批次</text>
    <text x="125" y="59" text-anchor="middle" class="font card-code">[N, 3, 64, 64]</text>

    <g transform="translate(48 110)">
      <rect x="28" y="0" width="126" height="126" rx="8" fill="#3b82f6" opacity="0.88"/>
      <rect x="14" y="14" width="126" height="126" rx="8" fill="#22c55e" opacity="0.82"/>
      <rect x="0" y="28" width="126" height="126" rx="8" fill="#ef4444" opacity="0.82"/>
      <text x="63" y="98" text-anchor="middle" class="font card-title">RGB</text>
    </g>

    <text x="28" y="305" class="font body">N：批次中的图片数量</text>
    <text x="28" y="338" class="font body">3：红、绿、蓝通道</text>
    <text x="28" y="371" class="font body">64×64：图片尺寸</text>
  </g>

  <line x1="305" y1="360" x2="360" y2="360" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 卷积 -->
  <g transform="translate(375 120)" filter="url(#shadow)">
    <rect width="285" height="480" rx="20" fill="#ffffff" stroke="#bfdbfe"/>
    <rect width="285" height="82" rx="20" fill="url(#convGradient)"/>
    <rect y="62" width="285" height="20" fill="#4f46e5"/>
    <text x="142.5" y="34" text-anchor="middle" class="font card-title">二维卷积</text>
    <text x="142.5" y="62" text-anchor="middle" class="font card-code">nn.Conv2d(...)</text>

    <g transform="translate(78 116)">
      <rect width="126" height="126" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <g stroke="#93c5fd" stroke-width="1">
        <path d="M42 0V126 M84 0V126 M0 42H126 M0 84H126"/>
      </g>
      <rect x="42" y="42" width="42" height="42" fill="#2563eb" opacity="0.85"/>
      <text x="63" y="69" text-anchor="middle" class="font card-code">3×3</text>
    </g>

    <text x="25" y="285" class="font body">输入通道：3</text>
    <text x="25" y="318" class="font body">卷积核数量：8</text>
    <text x="25" y="351" class="font body">观察区域：3×3</text>
    <text x="25" y="384" class="font body">padding：1</text>
    <rect x="23" y="412" width="239" height="45" rx="10" fill="#eff6ff"/>
    <text x="142.5" y="441" text-anchor="middle" class="font shape">输出 [N, 8, 64, 64]</text>
  </g>

  <line x1="670" y1="360" x2="725" y2="360" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ReLU -->
  <g transform="translate(740 145)" filter="url(#shadow)">
    <rect width="250" height="430" rx="20" fill="#ffffff" stroke="#e9d5ff"/>
    <rect width="250" height="72" rx="20" fill="url(#reluGradient)"/>
    <rect y="52" width="250" height="20" fill="#a855f7"/>
    <text x="125" y="35" text-anchor="middle" class="font card-title">激活函数</text>
    <text x="125" y="59" text-anchor="middle" class="font card-code">nn.ReLU()</text>

    <g transform="translate(34 120)">
      <rect width="78" height="62" rx="10" fill="#fee2e2"/>
      <text x="39" y="39" text-anchor="middle" class="font shape" fill="#b91c1c">−2.4</text>
      <path d="M92 31 H125" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="139" width="78" height="62" rx="10" fill="#dcfce7"/>
      <text x="178" y="39" text-anchor="middle" class="font shape" fill="#15803d">0</text>
    </g>
    <g transform="translate(34 205)">
      <rect width="78" height="62" rx="10" fill="#dbeafe"/>
      <text x="39" y="39" text-anchor="middle" class="font shape" fill="#1d4ed8">3.1</text>
      <path d="M92 31 H125" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="139" width="78" height="62" rx="10" fill="#dbeafe"/>
      <text x="178" y="39" text-anchor="middle" class="font shape" fill="#1d4ed8">3.1</text>
    </g>

    <text x="125" y="321" text-anchor="middle" class="font body">负数变成 0</text>
    <text x="125" y="352" text-anchor="middle" class="font body">正数保持不变</text>
    <rect x="22" y="374" width="206" height="40" rx="10" fill="#faf5ff"/>
    <text x="125" y="400" text-anchor="middle" class="font shape">形状保持不变</text>
  </g>

  <line x1="1000" y1="360" x2="1055" y2="360" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 最大池化 -->
  <g transform="translate(1070 120)" filter="url(#shadow)">
    <rect width="285" height="480" rx="20" fill="#ffffff" stroke="#a7f3d0"/>
    <rect width="285" height="82" rx="20" fill="url(#poolGradient)"/>
    <rect y="62" width="285" height="20" fill="#10b981"/>
    <text x="142.5" y="34" text-anchor="middle" class="font card-title">最大池化</text>
    <text x="142.5" y="62" text-anchor="middle" class="font card-code">nn.MaxPool2d(2)</text>

    <g transform="translate(38 120)">
      <rect width="112" height="112" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <path d="M56 0V112 M0 56H112" stroke="#6ee7b7" stroke-width="2"/>
      <text x="28" y="35" text-anchor="middle" class="font shape">1</text>
      <text x="84" y="35" text-anchor="middle" class="font shape">5</text>
      <text x="28" y="91" text-anchor="middle" class="font shape">3</text>
      <text x="84" y="91" text-anchor="middle" class="font shape">2</text>
      <path d="M126 56 H158" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="172" y="24" width="64" height="64" rx="10" fill="#10b981"/>
      <text x="204" y="64" text-anchor="middle" class="font card-title">5</text>
    </g>

    <text x="142.5" y="286" text-anchor="middle" class="font body">每个 2×2 区域</text>
    <text x="142.5" y="318" text-anchor="middle" class="font body">只保留最大值</text>
    <text x="142.5" y="357" text-anchor="middle" class="font body">特征图数量仍为 8</text>
    <text x="142.5" y="389" text-anchor="middle" class="font body">高度、宽度各减半</text>
    <rect x="23" y="412" width="239" height="45" rx="10" fill="#ecfdf5"/>
    <text x="142.5" y="441" text-anchor="middle" class="font shape">输出 [N, 8, 32, 32]</text>
  </g>

  <g transform="translate(210 642)">
    <rect width="980" height="48" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="490" y="30" text-anchor="middle" class="font body">
      卷积负责提取局部特征　→　ReLU 保留有效的正响应　→　最大池化压缩特征图
    </text>
  </g>
</svg>
