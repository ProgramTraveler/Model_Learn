<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img"><title>全局平均池化：每个通道单独求平均</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="450" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">全局平均池化：每个通道单独求平均</text><text x="45" y="101" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道 1</text><rect x="45" y="115" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="141.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="85" y="115" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="141.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="45" y="155" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="181.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">5</text><rect x="85" y="155" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="181.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">7</text><text x="45" y="256" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道 2</text><rect x="45" y="270" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="296.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="85" y="270" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="296.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><rect x="45" y="310" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="54.2" y="336.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">6</text><rect x="85" y="310" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="94.2" y="336.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8</text><path d="M140 155 L310 155" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="330" y="115" width="360" height="57" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="344" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">(1+3+5+7) / 4 = 4</text><path d="M140 310 L310 310" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="330" y="270" width="360" height="57" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="344" y="299" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">(2+4+6+8) / 4 = 5</text><path d="M690 145 L830 220" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M690 300 L830 240" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="850" y="190" width="200" height="84" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="864" y="219" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出向量</text><text x="864" y="246" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">[4, 5]</text><text x="35" y="430" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2 个通道得到 2 个数；每张表内部平均，不把所有通道混为一个数。</text></svg>