<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img"><title>最近邻上采样：增加网格位置，重复已有数值</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="340" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">最近邻上采样：增加网格位置，重复已有数值</text><text x="65" y="111" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B：1×1×1</text><rect x="65" y="125" width="55" height="55" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="77.65" y="161.85" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><path d="M140 150 L350 150" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="400" y="86" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B′：1×2×2</text><rect x="400" y="100" width="55" height="55" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="412.65" y="136.85" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="455" y="100" width="55" height="55" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="467.65" y="136.85" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="400" y="155" width="55" height="55" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="412.65" y="191.85" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="455" y="155" width="55" height="55" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="467.65" y="191.85" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="650" y="100" width="390" height="111" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="664" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一个通道仍是一个通道</text><text x="664" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">高宽从 1×1 变为 2×2</text><text x="664" y="183" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">四个位置共享原来的数值</text><text x="35" y="320" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">此例使用最近邻插值；上采样不会自动恢复已丢失的真实细节。</text></svg>