<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310"><rect width="1040" height="310" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="36" font-size="24">Head 的 1×1 卷积：在同一位置重新组合 256 个数</text><rect x="30" y="80" width="265" height="110" rx="9" fill="#e3edfc"/><text x="45" y="115" font-size="21">某个空间位置</text><text x="45" y="155" font-size="19">输入：256 个通道值</text><text x="310" y="145" font-size="25">→</text><rect x="350" y="80" width="310" height="110" rx="9" fill="#e1f2eb"/><text x="365" y="115" font-size="21">1280 套可训练过滤器</text><text x="365" y="155" font-size="18">每套组合全部 256 个输入值</text><text x="675" y="145" font-size="25">→</text><rect x="715" y="80" width="295" height="110" rx="9" fill="#fff0da"/><text x="730" y="115" font-size="21">同一位置的新表示</text><text x="730" y="155" font-size="19">输出：1280 个通道值</text><text x="25" y="235" font-size="18">在各空间位置复用同一套权重；不读取邻近位置，不扩大空间感受野。</text><text x="25" y="272" font-size="16">按普通 1×1 卷积解释；外层 Conv 配置了 BN、SiLU，具体包装器实现尚未核验。</text></g></svg>