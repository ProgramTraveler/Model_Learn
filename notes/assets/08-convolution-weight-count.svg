<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>普通卷积的权重：每个输出通道各有一套</title><rect width="1100" height="650" fill="#f7f9fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><text x="30" y="40" font-size="26" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">先数一套过滤器，再乘以输出通道数</text><rect x="30" y="90" width="1040" height="215" rx="9" fill="#e1f2eb" stroke="#94a8bf"/><text x="48" y="122" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加后：64 个输入通道 → 3×3 普通卷积 → 64 个输出通道</text><rect x="96" y="150" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="150" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="150" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="96" y="172" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="172" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="172" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="96" y="194" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="194" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="194" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="160" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="160" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="160" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="182" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="182" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="182" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="204" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="204" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="204" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="170" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="170" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="170" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="192" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="192" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="192" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="214" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="214" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="214" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><text x="170" y="185" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64 张 3×3 权重表</text><text x="170" y="217" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一套：64×3×3 = 576 个权重</text><path d="M450 200 L515 200" stroke="#526780" stroke-width="2.2" fill="none" marker-end="url(#a)"/><text x="535" y="185" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每个输出通道各一套，共 64 套</text><text x="535" y="227" font-size="23" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">576 × 64 = 36,864 个卷积权重</text><text x="48" y="280" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图中仅画出一套中的 3 张权重表，其余省略；每套都读取全部输入通道。</text><rect x="30" y="330" width="1040" height="215" rx="9" fill="#fff0da" stroke="#94a8bf"/><text x="48" y="362" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">拼接后：128 个输入通道 → 3×3 普通卷积 → 64 个输出通道</text><rect x="96" y="390" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="390" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="390" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="96" y="412" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="412" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="412" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="96" y="434" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="118" y="434" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="140" y="434" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="400" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="400" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="400" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="422" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="422" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="422" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="78" y="444" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="100" y="444" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="122" y="444" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="410" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="410" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="410" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="432" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="432" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="432" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="60" y="454" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="82" y="454" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><rect x="104" y="454" width="22" height="22" rx="9" fill="#e3edfc" stroke="#94a8bf"/><text x="170" y="425" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128 张 3×3 权重表</text><text x="170" y="457" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一套：128×3×3 = 1152 个权重</text><path d="M450 440 L515 440" stroke="#526780" stroke-width="2.2" fill="none" marker-end="url(#a)"/><text x="535" y="425" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每个输出通道各一套，共 64 套</text><text x="535" y="467" font-size="23" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1152 × 64 = 73,728 个卷积权重</text><text x="48" y="520" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">图中仅画出一套中的 3 张权重表，其余省略；每套都读取全部输入通道。</text><text x="35" y="600" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">40×40 个空间位置复用同一套权重，不为每个位置新增一套。</text><text x="35" y="632" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">限定普通卷积（groups=1）；未计偏置、归一化或其他层。权重数量不等于运行耗时。</text></svg>