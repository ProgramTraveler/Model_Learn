<text x="229.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">7</text><rect x="260" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="269.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8</text><path d="M335 160 L465 160" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="490" y="126" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">固定顺序的向量</text><rect x="490" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="501.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="540" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="551.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="590" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="601.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="640" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="651.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><rect x="690" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="701.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">5</text><rect x="740" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="751.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">6</text><rect x="790" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="801.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">7</text><rect x="840" y="140" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="851.5" y="173.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8</text><text x="40" y="285" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学例子：2×2×2 → 8 个数；当前代码：8×32×32 → 8192 个数。</text><text x="40" y="325" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Linear 能为向量的不同索引设置不同权重，也就能区分原来的通道与空间位置。</text><text x="35" y="380" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Flatten 没有可学习参数；后面的 Linear 有权重和偏置。</text></svg>