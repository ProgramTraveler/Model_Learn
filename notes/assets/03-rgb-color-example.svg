<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="#f7f9fc"/><g font-family="PingFang SC, sans-serif"><text x="28" y="38" font-size="24" fill="#20324c">① 原图：只有 2×2 个像素，每个像素有 R、G、B 三个数</text><rect x="40" y="65" width="76" height="76" fill="#ff0000" stroke="#94a7bf"/><text x="52" y="110.0" font-size="19" fill="#16243b">红</text><rect x="116" y="65" width="76" height="76" fill="#00ff00" stroke="#94a7bf"/><text x="128" y="110.0" font-size="19" fill="#16243b">绿</text><rect x="40" y="141" width="76" height="76" fill="#0000ff" stroke="#94a7bf"/><text x="52" y="186.0" font-size="19" fill="#ffffff">蓝</text><rect x="116" y="141" width="76" height="76" fill="#ffff00" stroke="#94a7bf"/><text x="128" y="186.0" font-size="19" fill="#16243b">黄</text><text x="240" y="100" font-size="20" fill="#20324c">左上红色：(255, 0, 0)</text><text x="240" y="139" font-size="20" fill="#20324c">右上绿色：(0, 255, 0)</text><text x="650" y="100" font-size="20" fill="#20324c">左下蓝色：(0, 0, 255)</text><text x="650" y="139" font-size="20" fill="#20324c">右下黄色：(255, 255, 0)</text><text x="240" y="195" font-size="18" fill="#20324c">顺序统一为 (R, G, B)；这里用 0～255 表示颜色分量。</text><text x="28" y="266" font-size="24" fill="#20324c">② 按分量拆开：同一张图的三个通道，每个通道仍是 2×2</text><text x="40" y="308" font-size="20" fill="#20324c">R 通道：红分量</text><rect x="40" y="330" width="76" height="76" fill="#ffffff" stroke="#94a7bf"/><text x="52" y="375.0" font-size="19" fill="#16243b">255</text><rect x="116" y="330" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="128" y="375.0" font-size="19" fill="#ffffff">0</text><rect x="40" y="406" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="52" y="451.0" font-size="19" fill="#ffffff">0</text><rect x="116" y="406" width="76" height="76" fill="#ffffff" stroke="#94a7bf"/><text x="128" y="451.0" font-size="19" fill="#16243b">255</text><text x="395" y="308" font-size="20" fill="#20324c">G 通道：绿分量</text><rect x="395" y="330" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="407" y="375.0" font-size="19" fill="#ffffff">0</text><rect x="471" y="330" width="76" height="76" fill="#ffffff" stroke="#94a7bf"/><text x="483" y="375.0" font-size="19" fill="#16243b">255</text><rect x="395" y="406" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="407" y="451.0" font-size="19" fill="#ffffff">0</text><rect x="471" y="406" width="76" height="76" fill="#ffffff" stroke="#94a7bf"/><text x="483" y="451.0" font-size="19" fill="#16243b">255</text><text x="750" y="308" font-size="20" fill="#20324c">B 通道：蓝分量</text><rect x="750" y="330" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="762" y="375.0" font-size="19" fill="#ffffff">0</text><rect x="826" y="330" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="838" y="375.0" font-size="19" fill="#ffffff">0</text><rect x="750" y="406" width="76" height="76" fill="#ffffff" stroke="#94a7bf"/><text x="762" y="451.0" font-size="19" fill="#16243b">255</text><rect x="826" y="406" width="76" height="76" fill="#000000" stroke="#94a7bf"/><text x="838" y="451.0" font-size="19" fill="#ffffff">0</text><text x="28" y="520" font-size="19" fill="#20324c">通道用灰度显示：白 = 255（分量强），黑 = 0（没有该分量）。</text><text x="28" y="563" font-size="23" fill="#20324c">③ 看右下角：R=255、G=255、B=0 → 合成黄色</text><text x="28" y="609" font-size="21" fill="#20324c">3 个通道 × 2 行 × 2 列 = 12 个数；不是 3 张不同的照片。</text></g></svg>