<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="30" y="45" font-size="25">创建层配置计算结构；调用层处理本次数据</text><rect x="30" y="80" width="1040" height="110" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="50" y="118" font-size="21">① 创建一次：layer = nn.Linear(3, 2, bias=True)</text><text x="50" y="160" font-size="19">配置输入 / 输出维度 → 创建并初始化权重 [2,3]、偏置 [2]</text><rect x="30" y="225" width="280" height="100" rx="12" fill="#e1f2eb" stroke="#94a7bf"/><rect x="385" y="225" width="330" height="100" rx="12" fill="#e3edfc" stroke="#94a7bf"/><rect x="790" y="225" width="280" height="100" rx="12" fill="#fff0da" stroke="#94a7bf"/><text x="50" y="262" font-size="20">② 传入数据 x=[5,2,1]</text><text x="50" y="299" font-size="18">本例形状 [3]</text><text x="405" y="262" font-size="20">z = layer(x)</text><text x="405" y="299" font-size="18">使用当前参数 → 形状 [2]</text><text x="810" y="262" font-size="20">h = ReLU(z)</text><text x="810" y="299" font-size="18">隐藏层输出，形状 [2]</text><text x="335" y="285" font-size="27">→</text><text x="740" y="285" font-size="27">→</text><text x="30" y="380" font-size="18">输出数值取决于当前参数；bias=False 只去掉偏置，不去掉权重。此图不包含训练更新。</text></g></svg>