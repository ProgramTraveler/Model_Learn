<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>同一套权重在不同输出位置重复计算</title><rect width="1100" height="600" fill="#f7f9fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><text x="30" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">权重只存一套，计算却要在每个输出位置重新做</text><rect x="35" y="85" width="310" height="160" rx="8" fill="#e3edfc" stroke="#94a7bf"/><text x="50" y="120" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加路径：一个输出通道</text><text x="50" y="160" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一套过滤器有 576 个权重</text><text x="50" y="200" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">各位置共享这套权重</text><path d="M345 165 L470 127" fill="none" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="490" y="105" width="520" height="52" rx="8" fill="#e1f2eb" stroke="#94a7bf"/><text x="510" y="138" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置 A：576 次乘加</text><path d="M345 165 L470 202" fill="none" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="490" y="180" width="520" height="52" rx="8" fill="#e1f2eb" stroke="#94a7bf"/><text x="510" y="213" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置 B：576 次乘加</text><path d="M345 165 L470 277" fill="none" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="490" y="255" width="520" height="52" rx="8" fill="#e1f2eb" stroke="#94a7bf"/><text x="510" y="288" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">……共 40×40 个位置</text><text x="35" y="355" font-size="22" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一个通道：576 × 40 × 40 = 921,600 MACs</text><text x="35" y="398" font-size="22" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64 个通道：921,600 × 64 = 58,982,400 MACs</text><rect x="35" y="430" width="1030" height="100" rx="8" fill="#fff0da" stroke="#94a7bf"/><text x="50" y="466" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">拼接路径：每个位置读取 1152 个数，而不是 576 个</text><text x="50" y="505" font-size="22" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1152 × 40 × 40 × 64 = 117,964,800 MACs</text><text x="35" y="575" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">单张图、普通稠密卷积的标准估算；未计偏置、融合操作、激活与其他层。</text></svg>