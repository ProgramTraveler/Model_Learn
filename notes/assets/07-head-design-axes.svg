<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="330" viewBox="0 0 1060 330"><rect width="1060" height="330" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="35" font-size="23">Head 的三个设计方向：宽度、深度、空间范围</text><rect x="25" y="65" width="1010" height="65" rx="8" fill="#e3edfc"/><text x="40" y="104" font-size="20">加宽</text><text x="145" y="104" font-size="19">1×1：256 → 1280</text><text x="605" y="104" font-size="18">同一位置，产生更多通道</text><rect x="25" y="140" width="1010" height="65" rx="8" fill="#e1f2eb"/><text x="40" y="179" font-size="20">加深</text><text x="145" y="179" font-size="19">1×1 → 激活 → 1×1 → 激活</text><text x="605" y="179" font-size="18">同一位置，增加多步非线性加工</text><rect x="25" y="215" width="1010" height="65" rx="8" fill="#fff0da"/><text x="40" y="254" font-size="20">空间加工</text><text x="145" y="254" font-size="19">3×3 卷积读取邻近位置</text><text x="605" y="254" font-size="18">跨位置组合局部布局</text><text x="25" y="315" font-size="16">按普通卷积比较；共享模块冻结，图中均为 Head 候选设计，不代表已修改或验证。</text></g></svg>