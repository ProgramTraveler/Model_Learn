<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img"><title>空间尺寸与元素总数：一张表和一叠表分开看</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="400" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">空间尺寸与元素总数：一张表和一叠表分开看</text><text x="50" y="96" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">只画一个通道的局部</text><rect x="50" y="110" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="59.2" y="136.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">a</text><rect x="90" y="110" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="99.2" y="136.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">b</text><rect x="130" y="110" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="139.2" y="136.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="50" y="150" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="59.2" y="176.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">c</text><rect x="90" y="150" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="99.2" y="176.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">d</text><rect x="130" y="150" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="139.2" y="176.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="50" y="190" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="59.2" y="216.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="90" y="190" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="99.2" y="216.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="130" y="190" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="139.2" y="216.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">…</text><rect x="310" y="95" width="720" height="111" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="324" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每张完整表：80 行 × 80 列 = 6400 个数</text><text x="324" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">共有 128 张表：128 × 6400 = 819200 个数</text><text x="324" y="178" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C=128 描述表的张数；H=W=80 描述每张表的大小</text><text x="310" y="270" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一个格子是多层计算得到的特征值，不是原像素的简单复制。</text><text x="35" y="380" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">数值总数用于理解接口与存储规模，不能直接衡量特征质量。</text></svg>