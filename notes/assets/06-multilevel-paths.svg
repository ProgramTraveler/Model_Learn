<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>相同 backbone：只读最后一层，或取出多层再融合</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="620" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相同 backbone：只读最后一层，或取出多层再融合</text><text x="35" y="100" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A：最后一层 → head</text><rect x="35" y="125" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="50" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第一层</text><text x="50" y="181" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">32×320×320</text><rect x="300" y="125" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="315" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第二层</text><text x="315" y="181" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×160×160</text><rect x="565" y="125" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="580" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第三层</text><text x="580" y="181" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×80×80</text><path d="M255 165 L290 165" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 165 L555 165" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 165 L825 165" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="125" width="220" height="85" rx="12" fill="#eee7fa" stroke="#94a7bd"/><text x="855" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类 head</text><text x="855" y="181" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个类别分数</text><text x="35" y="340" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B：多层特征 → neck → head</text><rect x="35" y="365" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="50" y="394" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第一层</text><text x="50" y="421" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">32×320×320</text><rect x="300" y="365" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="315" y="394" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第二层</text><text x="315" y="421" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×160×160</text><rect x="565" y="365" width="220" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="580" y="394" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第三层</text><text x="580" y="421" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×80×80</text><path d="M255 405 L290 405" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 405 L555 405" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="505" width="485" height="65" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="315" y="534" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">neck：对齐尺寸、融合并处理特征</text><path d="M145 450 L320 500" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M410 450 L410 500" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M675 450 L675 500" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M785 537 L825 537" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="495" width="220" height="85" rx="12" fill="#eee7fa" stroke="#94a7bd"/><text x="855" y="524" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类 head</text><text x="855" y="551" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个类别分数</text><text x="35" y="270" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">方案 A 也必须先计算前两层；head 只直接读取第三层。</text><text x="35" y="610" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">同一张图的中间结果；融合需要额外计算，效果需通过对照实验验证。</text></svg>