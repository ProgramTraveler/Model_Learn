24c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="780" y="160" width="40" height="40" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="789.2" y="186.8" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><text x="500" y="285" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 2×2×2：2 张表，每张 2 行、2 列，共 8 个数。</text><text x="35" y="370" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">没有数值相加，也没有把表左右接宽；拼接之后常用卷积学习通道组合。</text></svg>