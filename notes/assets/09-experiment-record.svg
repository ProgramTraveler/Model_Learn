<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310"><rect width="1000" height="310" fill="#f7f9fc"/><text x="30" y="40" font-family="PingFang SC, sans-serif" font-size="26" fill="#20324c">实验表的一行：同一次训练、同一个选中 checkpoint</text><rect x="30" y="80" width="290" height="100" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="45" y="115" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">方案 A + 种子 1</text><text x="45" y="153" font-family="PingFang SC, sans-serif" font-size="19" fill="#20324c">完成一次训练</text><rect x="355" y="80" width="290" height="100" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="370" y="115" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">统一选择规则</text><text x="370" y="153" font-family="PingFang SC, sans-serif" font-size="19" fill="#20324c">例如选中第 18 轮</text><rect x="680" y="80" width="290" height="100" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="695" y="115" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">保存一组对应结果</text><text x="695" y="153" font-family="PingFang SC, sans-serif" font-size="19" fill="#20324c">FN=280；FP=314</text><text x="325" y="137" font-family="PingFang SC, sans-serif" font-size="25" fill="#20324c">→</text><text x="650" y="137" font-family="PingFang SC, sans-serif" font-size="25" fill="#20324c">→</text><text x="30" y="230" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">第 25 轮：FN=300；FP=290，是另一组结果。</text><text x="30" y="275" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">不能拼成 FN=280、FP=290：这不是上述任何一轮的实际结果。</text></svg>