<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img"><title>简化 neck 的完整数据流：每一步改变什么</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="820" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">简化 neck 的完整数据流：每一步改变什么</text><rect x="35" y="100" width="330" height="85" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="50" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">浅层 A：64×40×40</text><text x="50" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">直接保留这一路</text><rect x="35" y="240" width="330" height="85" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="50" y="269" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">深层 B：128×20×20</text><text x="50" y="296" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128 张 20×20 的表</text><path d="M365 282 L410 282" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="425" y="225" width="290" height="115" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="440" y="254" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">① 1×1 卷积</text><text x="440" y="281" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128 → 64 个通道</text><text x="440" y="308" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">得到 64×20×20</text><path d="M715 282 L760 282" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="775" y="225" width="290" height="115" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="790" y="254" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">② 上采样</text><text x="790" y="281" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">20×20 → 40×40</text><text x="790" y="308" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">得到 64×40×40</text><path d="M200 185 L200 400" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920 340 L920 400" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="410" width="800" height="90" rx="12" fill="#fff0d9" stroke="#94a7bd"/><text x="175" y="439" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">③ 沿通道拼接：64 + 64 = 128 张表</text><text x="175" y="466" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 128×40×40；只组织数值，不学习组合权重</text><path d="M560 500 L560 535" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="545" width="800" height="90" rx="12" fill="#eee7fa" stroke="#94a7bd"/><text x="175" y="574" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">④ 3×3 卷积：128 个输入通道 → 64 个输出通道</text><text x="175" y="601" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 64×40×40；stride=1、padding=1，学习组合两路信息</text><path d="M560 635 L560 670" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="680" width="800" height="70" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="175" y="709" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类 head：每张表求平均 → 64 个数 → Linear(64,2) → 两个分数</text><text x="35" y="790" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学结构，非 YOLOv8PAFPN 实现。① 压缩通道是成本选择，并非拼接的必要条件。</text></svg>