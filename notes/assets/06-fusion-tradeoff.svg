<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img"><title>相加与拼接：信息如何留下来</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="390" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加与拼接：信息如何留下来</text><rect x="35" y="100" width="480" height="111" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="49" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加：输入两个数 → 一个和</text><text x="49" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">数值先合并，输出通道数不增加</text><text x="49" y="183" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">要求两路通道数一致</text><rect x="565" y="100" width="500" height="111" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="579" y="129" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">拼接：输入两张表 → 保留两张表</text><text x="579" y="156" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出通道增加，后续卷积再学习组合</text><text x="579" y="183" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">增加中间存储，通常增加后续计算</text><text x="35" y="295" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">把输入按对应位置相加，与把输入分别留给后续计算，是两种不同的信息组织。</text><text x="35" y="370" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">代价与表达方式不同；不能由这张图推断哪种方式一定更准确。</text></svg>