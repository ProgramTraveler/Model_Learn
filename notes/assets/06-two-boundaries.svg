<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img"><title>覆盖范围决定某个位置能否同时依赖两侧</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="460" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">覆盖范围决定某个位置能否同时依赖两侧</text><text x="40" y="130" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">较小覆盖范围</text><rect x="290" y="100" width="730" height="115" rx="8" fill="#edf2f7" stroke="#96a9be"/><rect x="345" y="120" width="95" height="75" rx="8" fill="#b5c8e2" stroke="#96a9be"/><rect x="850" y="120" width="95" height="75" rx="8" fill="#b5c8e2" stroke="#96a9be"/><text x="350" y="165" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">左边界</text><text x="855" y="165" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">右边界</text><rect x="325" y="107" width="150" height="100" fill="none" stroke="#b36d26" stroke-width="3" stroke-dasharray="8 5"/><text x="500" y="165" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">右侧不在此位置的覆盖范围内</text><text x="40" y="295" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">较大覆盖范围</text><rect x="290" y="265" width="730" height="115" rx="8" fill="#edf2f7" stroke="#96a9be"/><rect x="345" y="285" width="95" height="75" rx="8" fill="#b5c8e2" stroke="#96a9be"/><rect x="850" y="285" width="95" height="75" rx="8" fill="#b5c8e2" stroke="#96a9be"/><text x="350" y="330" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">左边界</text><text x="855" y="330" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">右边界</text><rect x="325" y="272" width="640" height="100" fill="none" stroke="#b36d26" stroke-width="3" stroke-dasharray="8 5"/><text x="500" y="330" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">可同时依赖两侧</text><text x="35" y="440" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">示意单个位置的理论依赖范围；覆盖只是结构上的可能，不保证训练后充分利用。</text></svg>