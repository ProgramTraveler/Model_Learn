<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><rect width="1000" height="390" fill="#f7f9fc"/><text x="25" y="38" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">一个通道的教学例子：数值相同，位置不同</text><text x="60" y="80" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">特征 A</text><rect x="60" y="100" width="75" height="65" fill="#9ac7fa" stroke="#94a7bf"/><text x="90" y="142" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">8</text><rect x="135" y="100" width="75" height="65" fill="#9ac7fa" stroke="#94a7bf"/><text x="165" y="142" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">8</text><rect x="60" y="165" width="75" height="65" fill="#e7edf5" stroke="#94a7bf"/><text x="90" y="207" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">0</text><rect x="135" y="165" width="75" height="65" fill="#e7edf5" stroke="#94a7bf"/><text x="165" y="207" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">0</text><text x="240" y="145" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">全局平均 → 4</text><text x="240" y="195" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">分区后：</text><text x="240" y="227" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">[8, 8, 0, 0]</text><text x="550" y="80" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">特征 B</text><rect x="550" y="100" width="75" height="65" fill="#e7edf5" stroke="#94a7bf"/><text x="580" y="142" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">0</text><rect x="625" y="100" width="75" height="65" fill="#e7edf5" stroke="#94a7bf"/><text x="655" y="142" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">0</text><rect x="550" y="165" width="75" height="65" fill="#9ac7fa" stroke="#94a7bf"/><text x="580" y="207" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">8</text><rect x="625" y="165" width="75" height="65" fill="#9ac7fa" stroke="#94a7bf"/><text x="655" y="207" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">8</text><text x="730" y="145" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">全局平均 → 4</text><text x="730" y="195" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">分区后：</text><text x="730" y="227" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">[0, 0, 8, 8]</text><text x="25" y="290" font-family="PingFang SC,sans-serif" font-size="22" fill="#20324c">只看全局均值：两者都是 4。</text><text x="25" y="335" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">保留位置后：Linear 可以对不同区域使用不同权重，区分这两种布局。</text><text x="25" y="372" font-family="PingFang SC,sans-serif" font-size="18" fill="#20324c">本例只展示信息差异，不代表训练后的模型一定利用它完成窄道判断。</text></svg>