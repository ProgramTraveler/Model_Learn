<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img"><title>教学 backbone：三个量要分别看</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="470" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学 backbone：三个量要分别看</text><rect x="30" y="115" width="230" height="155" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="45" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">原始图片</text><text x="45" y="171" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3×640×640</text><text x="45" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野 1×1</text><text x="45" y="225" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置间隔 1</text><rect x="300" y="115" width="230" height="155" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="315" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第一层</text><text x="315" y="171" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">32×320×320</text><text x="315" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野 3×3</text><text x="315" y="225" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置间隔 2</text><rect x="570" y="115" width="230" height="155" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="585" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第二层</text><text x="585" y="171" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">64×160×160</text><text x="585" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野 7×7</text><text x="585" y="225" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置间隔 4</text><rect x="840" y="115" width="230" height="155" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="855" y="144" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第三层</text><text x="855" y="171" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">128×80×80</text><text x="855" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野 15×15</text><text x="855" y="225" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">位置间隔 8</text><path d="M260 190 L293 190" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M530 190 L563 190" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 190 L833 190" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="320" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每层：3×3 卷积，stride=2，padding=1，再接激活函数。</text><text x="35" y="360" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道数：3 → 32 → 64 → 128（结构配置）   空间边长：640 → 320 → 160 → 80</text><text x="35" y="400" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野描述一个输出位置追溯到原图的范围；不是整张特征图的大小。</text><text x="35" y="437" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学结构，非当前代码；感受野数值指内部位置的理论覆盖范围。</text></svg>