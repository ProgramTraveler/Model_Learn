<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title"><title id="title">ReLU函数曲线与逐元素计算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526079"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="35" font-size="22" fill="#172033">ReLU：负数归零，非负数保持不变</text><path d="M75,330 L650,330" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M360,400 L360,60" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="335" font-size="18" fill="#172033">x</text><text x="370" y="62" font-size="18" fill="#172033">ReLU(x)</text><path d="M96,330 L360,330 L624,96" fill="none" stroke="#2563eb" stroke-width="4"/><text x="91" y="355" font-size="15" fill="#172033">-3</text><text x="179" y="355" font-size="15" fill="#172033">-2</text><text x="267" y="355" font-size="15" fill="#172033">-1</text><text x="355" y="355" font-size="15" fill="#172033">0</text><text x="443" y="355" font-size="15" fill="#172033">1</text><text x="531" y="355" font-size="15" fill="#172033">2</text><text x="619" y="355" font-size="15" fill="#172033">3</text><text x="338" y="257" font-size="15" fill="#172033">1</text><text x="338" y="179" font-size="15" fill="#172033">2</text><text x="338" y="101" font-size="15" fill="#172033">3</text><text x="80" y="105" font-size="18" fill="#172033">x &lt; 0 → 输出 0</text><text x="435" y="90" font-size="18" fill="#172033">x ≥ 0 → 输出 x</text><text x="50" y="445" font-size="20" fill="#172033">向量示例： [−2, 3, −1, 5] → [0, 3, 0, 5]</text></g></svg>