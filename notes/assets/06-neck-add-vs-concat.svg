<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>相同输入下的两条 neck 路径：相加与拼接</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="650" fill="#f7f9fc"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#20324c">只改变融合方式：两条路径都输出 64×40×40</text><rect x="30" y="85" width="1040" height="90" rx="9" fill="#e3edfc" stroke="#94a7bc"/><text x="44" y="115" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">共同准备：浅层 A 保持 64×40×40；深层 B 经 1×1 卷积和上采样 → B′：64×40×40</text><text x="44" y="143" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">下面各自读取同一组 A、B′，并假设空间坐标已对齐。</text><text x="35" y="225" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#20324c">路径 A：逐元素相加</text><rect x="35" y="245" width="270" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bc"/><text x="49" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">A + B′</text><text x="49" y="303" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">融合后：64×40×40</text><path d="M305 290 L365 290" fill="none" stroke="#526780" stroke-width="2.3" marker-end="url(#a)"/><rect x="380" y="245" width="310" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bc"/><text x="394" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">3×3 普通卷积</text><text x="394" y="303" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">64 输入通道 → 64 输出通道</text><path d="M690 290 L750 290" fill="none" stroke="#526780" stroke-width="2.3" marker-end="url(#a)"/><rect x="765" y="245" width="300" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bc"/><text x="779" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">输出：64×40×40</text><text x="779" y="303" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">接同样的分类 head</text><text x="35" y="410" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#20324c">路径 B：沿通道拼接</text><rect x="35" y="430" width="270" height="90" rx="9" fill="#fff0da" stroke="#94a7bc"/><text x="49" y="460" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">保留 A、B′ 两组表</text><text x="49" y="488" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">融合后：128×40×40</text><path d="M305 475 L365 475" fill="none" stroke="#526780" stroke-width="2.3" marker-end="url(#a)"/><rect x="380" y="430" width="310" height="90" rx="9" fill="#fff0da" stroke="#94a7bc"/><text x="394" y="460" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">3×3 普通卷积</text><text x="394" y="488" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">128 输入通道 → 64 输出通道</text><path d="M690 475 L750 475" fill="none" stroke="#526780" stroke-width="2.3" marker-end="url(#a)"/><rect x="765" y="430" width="300" height="90" rx="9" fill="#fff0da" stroke="#94a7bc"/><text x="779" y="460" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">输出：64×40×40</text><text x="779" y="488" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#20324c">接同样的分类 head</text><text x="35" y="580" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#20324c">相加先把对应数值合并；拼接先分别保留，让后续卷积学习怎样组合。</text><text x="35" y="620" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#20324c">教学对照：两路的 3×3 卷积均设 stride=1、padding=1；效果尚未验证。</text></svg>