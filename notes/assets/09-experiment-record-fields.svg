<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290"><rect width="1000" height="290" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">实验记录：先知道条件，再解释结果</text><rect x="25" y="65" width="300" height="145" rx="12" fill="#e3edfc"/><rect x="350" y="65" width="300" height="145" rx="12" fill="#e3edfc"/><rect x="675" y="65" width="300" height="145" rx="12" fill="#e1f3e9"/><text x="43" y="101" font-size="22">共同设置</text><text x="43" y="139" font-size="19">数据、固定模块、预处理</text><text x="43" y="178" font-size="19">训练预算、选择与评估规则</text><text x="368" y="101" font-size="22">这一次运行</text><text x="368" y="139" font-size="19">head配置、代码版本、种子</text><text x="368" y="178" font-size="19">checkpoint文件及选中轮次</text><text x="693" y="101" font-size="22">对应结果</text><text x="693" y="139" font-size="19">漏判、误报、召回、F1</text><text x="693" y="178" font-size="19">场景子集、耗时与内存</text><text x="25" y="260" font-size="21">共同设置单独存一份；每次运行引用其版本，并保存自己的配置和结果。</text></g></svg>