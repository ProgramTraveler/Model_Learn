<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250"><rect width="780" height="250" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c" font-size="21"><text x="25" y="36">相同输入，不同激活：逐元素计算，不改变形状</text><text x="25" y="85">输入 x</text><text x="250" y="85">−1</text><text x="425" y="85">0</text><text x="600" y="85">1</text><text x="25" y="130">ReLU(x)</text><text x="250" y="130">0</text><text x="425" y="130">0</text><text x="600" y="130">1</text><text x="25" y="175">SiLU(x)</text><text x="250" y="175">≈ −0.269</text><text x="425" y="175">0</text><text x="600" y="175">≈ 0.731</text><text x="25" y="222" font-size="17">SiLU(x)=x·sigmoid(x)：平滑过渡，负输入不全部置零。</text></g></svg>