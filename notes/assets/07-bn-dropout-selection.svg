<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330"><rect width="1080" height="330" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><rect x="25" y="20" width="505" height="255" rx="12" fill="#e3edfc"/><text x="41" y="57" font-size="21">BN：看输入形状与批统计可靠性</text><text x="41" y="101" font-size="17">[B,C,H,W] → BatchNorm2d</text><text x="41" y="146" font-size="17">[B,C] → 需要时用 BatchNorm1d</text><text x="41" y="191" font-size="17">小批量且统计不稳 → 比较 GroupNorm</text><text x="41" y="236" font-size="17">默认 eps、momentum 先不调整</text><rect x="550" y="20" width="505" height="255" rx="12" fill="#e3edfc"/><text x="566" y="57" font-size="21">Dropout：看训练与验证的过拟合迹象</text><text x="566" y="101" font-size="17">两者改善 → p=0</text><text x="566" y="146" font-size="17">训练改善、验证持续变差 → 试 p=0.1～0.2</text><text x="566" y="191" font-size="17">小概率有收益且仍过拟合 → 再比较 p=0.3</text><text x="566" y="236" font-size="17">训练和验证都差 → 不优先增加 Dropout</text><text x="25" y="310" font-size="17">这些是试验起点；分别训练，一次改变一项，保持 argmax，比较窄道漏判与非窄道误报。</text></g></svg>