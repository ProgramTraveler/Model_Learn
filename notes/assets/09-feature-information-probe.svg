<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290"><rect width="1000" height="290" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">检查可利用性：先固定同一份池化前特征</text><rect x="25" y="75" width="280" height="130" rx="12" fill="#e3edfc"/><text x="43" y="113" font-size="21">同一checkpoint</text><text x="43" y="151" font-size="20">冻结到Conv输出</text><text x="43" y="187" font-size="18">固定状态与预处理</text><text x="315" y="143" font-size="23">→</text><rect x="355" y="65" width="300" height="150" rx="12" fill="#e3edfc"/><text x="373" y="105" font-size="20">全局均值 → Linear</text><text x="373" y="147" font-size="20">全局均值 → MLP</text><text x="373" y="189" font-size="20">分区均值 → 分类器</text><text x="665" y="143" font-size="23">→</text><rect x="705" y="75" width="270" height="130" rx="12" fill="#e1f3e9"/><text x="723" y="113" font-size="21">独立验证集检查</text><text x="723" y="151" font-size="19">目标场景与总体结果</text><text x="723" y="187" font-size="18">同时看漏判与误报</text><text x="25" y="263" font-size="20">成功：有可利用的判别信息。失败：尚未读出，不等于证明信息不存在。</text></g></svg>