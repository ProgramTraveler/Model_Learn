<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>两种分类 head：数值怎样被使用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="620" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两种分类 head：数值怎样被使用</text><rect x="30" y="90" width="250" height="100" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="45" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">同一份输入特征</text><text x="45" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">8 张 32×32 的表</text><path d="M280 125 L350 125" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 160 L350 360" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="90" width="300" height="125" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="380" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A：Flatten</text><text x="380" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">固定顺序展开成 8192 个数</text><text x="380" y="173" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留数值及其位置索引</text><path d="M665 150 L715 150" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="90" width="330" height="125" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="745" y="119" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Linear(8192,2)</text><text x="745" y="146" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个分数</text><text x="745" y="173" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">16,386 个分类层参数</text><rect x="365" y="315" width="300" height="125" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="380" y="344" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B：全局平均池化</text><text x="380" y="371" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每张表分别平均 → 8 个数</text><text x="380" y="398" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">不保留通道内具体排列</text><path d="M665 375 L715 375" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="315" width="330" height="125" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="745" y="344" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Linear(8,2)</text><text x="745" y="371" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个分数</text><text x="745" y="398" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">18 个分类层参数</text><text x="35" y="265" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">单通道小例子</text><rect x="35" y="280" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="47" y="309" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="75" y="280" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="87" y="309" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="35" y="320" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="47" y="349" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">5</text><rect x="75" y="320" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="87" y="349" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">7</text><text x="170" y="265" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">改变排列</text><rect x="170" y="280" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="182" y="309" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">7</text><rect x="210" y="280" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="222" y="309" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">5</text><rect x="170" y="320" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="182" y="349" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="210" y="320" width="40" height="40" fill="#e0edff" stroke="#91a5bf"/><text x="222" y="349" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><text x="35" y="405" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两张表平均值都是 4</text><text x="35" y="500" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">参数数目仅统计最后的 Linear；前面的特征提取部分保持相同。</text><text x="35" y="542" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">平均后的排列损失能否接受，取决于前面是否已形成有用的关系表示。</text><text x="35" y="582" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A 是当前实现；B 是尚未执行的对照方案。参数少不能直接证明分类效果好。</text></svg>