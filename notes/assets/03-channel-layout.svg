<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="#f7f9fc"/><text x="30" y="42" font-family="PingFang SC,sans-serif" font-size="26" fill="#20324c">3 个通道 × 2 行 × 2 列：共 12 个数</text><text x="75" y="95" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">通道 1：2×2</text><rect x="75" y="125" width="100" height="80" fill="#ffe3ac" stroke="#94a7bf"/><text x="115" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">1</text><rect x="175" y="125" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="215" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">2</text><rect x="75" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="115" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">3</text><rect x="175" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="215" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">4</text><text x="425" y="95" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">通道 2：2×2</text><rect x="425" y="125" width="100" height="80" fill="#ffe3ac" stroke="#94a7bf"/><text x="465" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">5</text><rect x="525" y="125" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="565" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">6</text><rect x="425" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="465" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">7</text><rect x="525" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="565" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">8</text><text x="775" y="95" font-family="PingFang SC,sans-serif" font-size="21" fill="#20324c">通道 3：2×2</text><rect x="775" y="125" width="100" height="80" fill="#ffe3ac" stroke="#94a7bf"/><text x="815" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">9</text><rect x="875" y="125" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="915" y="173" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">10</text><rect x="775" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="815" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">11</text><rect x="875" y="205" width="100" height="80" fill="#e3edfc" stroke="#94a7bf"/><text x="915" y="253" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">12</text><text x="30" y="340" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">黄色格子：同一个左上角位置，跨三个通道取到 [1, 5, 9]。</text><text x="30" y="390" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">按通道看是 3 张表；按位置看是 4 个位置，每个位置有 3 个数。</text></svg>