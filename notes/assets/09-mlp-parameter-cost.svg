<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290"><rect width="1000" height="290" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">同样5120个输入：MLP成本主要来自第一个Linear</text><rect x="25" y="70" width="410" height="150" rx="12" fill="#e3edfc"/><rect x="475" y="70" width="500" height="150" rx="12" fill="#e1f3e9"/><text x="45" y="109" font-size="22">单Linear：5120 → 2</text><text x="45" y="153" font-size="22">5120×2＋2</text><text x="45" y="194" font-size="23">合计10,242个参数</text><text x="495" y="109" font-size="22">MLP：5120 → 128 → SiLU → 2</text><text x="495" y="153" font-size="20">(5120×128＋128)＋(128×2＋2)</text><text x="495" y="194" font-size="23">合计655,746个参数</text><text x="25" y="263" font-size="20">均含偏置；128仅为教学示例。分类器约64倍，不代表整个head约64倍。</text></g></svg>