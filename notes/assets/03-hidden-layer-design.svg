<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="#f7f9fc"/><text x="30" y="45" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">隐藏层设计：先选计算模板，再学习参数，最后验证方案</text><rect x="30" y="90" width="320" height="180" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="45" y="125" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">① 人选择结构</text><text x="45" y="165" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">全连接：3 个输入 → 2 个输出</text><text x="45" y="200" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">激活：ReLU</text><text x="45" y="235" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">确定 6 个权重与 2 个偏置</text><rect x="395" y="90" width="320" height="180" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="410" y="125" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">② 初始化并训练</text><text x="410" y="165" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">为权重、偏置设置初值</text><text x="410" y="200" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">前向计算 → 损失 → 梯度</text><text x="410" y="235" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">优化器更新参数</text><rect x="760" y="90" width="320" height="180" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="775" y="125" font-family="PingFang SC,sans-serif" font-size="20" fill="#20324c">③ 比较并调整</text><text x="775" y="165" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">独立验证数据上的表现</text><text x="775" y="200" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">计算、内存与部署成本</text><text x="775" y="235" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">有依据地调整宽度或层数</text><text x="360" y="190" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">→</text><text x="725" y="190" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">→</text><text x="30" y="320" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">人通常不手写每个隐藏单元的语义；更多单元或更多层，不保证效果更好。</text></svg>