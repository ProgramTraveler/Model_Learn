<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img"><title>三层感受野的逐步计算：三个位置只有两个间隔</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="920" fill="#f7f9fc"/><text x="30" y="40" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每层都读 3 个位置：扩展的是 2 个间隔，而不是 4 个</text><text x="30" y="78" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">三层均为 3×3 卷积、stride=2、padding=1；先画横向，纵向同样计算。</text><rect x="25" y="105" width="1050" height="230" rx="5" fill="#ffffff" stroke="#91a5bc"/><text x="45" y="138" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第 1 层：读取原图的三个位置</text><text x="45" y="180" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层感受野 r=1</text><text x="45" y="213" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层位置间隔 j=1</text><text x="45" y="252" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">r新 = 1 + (3−1)×1 = 3</text><text x="45" y="286" font-size="19" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">j新 = 1×2 = 2</text><circle cx="514.5" cy="168" r="5" fill="#386999"/><text x="507.5" y="154" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><circle cx="543.5" cy="168" r="5" fill="#386999"/><text x="536.5" y="154" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><circle cx="572.5" cy="168" r="5" fill="#386999"/><text x="565.5" y="154" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><path d="M520.5 168 L537.5 168" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="524.0" y="196" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><path d="M549.5 168 L566.5 168" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="553.0" y="196" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="500" y="210" width="29" height="16" rx="5" fill="#b9d4f3" stroke="#91a5bc"/><text x="465" y="224" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><rect x="529" y="232" width="29" height="16" rx="5" fill="#c4e5d5" stroke="#91a5bc"/><text x="465" y="246" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><rect x="558" y="254" width="29" height="16" rx="5" fill="#f5d6a4" stroke="#91a5bc"/><text x="465" y="268" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><rect x="500" y="285" width="87" height="19" rx="5" fill="#e4def6" stroke="#91a5bc"/><text x="500" y="323" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">三个覆盖区域的并集：宽 3（相对原图）</text><rect x="25" y="350" width="1050" height="230" rx="5" fill="#ffffff" stroke="#91a5bc"/><text x="45" y="383" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第 2 层：读取第 1 层的三个位置</text><text x="45" y="425" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层感受野 r=3</text><text x="45" y="458" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层位置间隔 j=2</text><text x="45" y="497" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">r新 = 3 + (3−1)×2 = 7</text><text x="45" y="531" font-size="19" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">j新 = 2×2 = 4</text><circle cx="543.5" cy="413" r="5" fill="#386999"/><text x="536.5" y="399" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><circle cx="601.5" cy="413" r="5" fill="#386999"/><text x="594.5" y="399" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><circle cx="659.5" cy="413" r="5" fill="#386999"/><text x="652.5" y="399" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><path d="M549.5 413 L595.5 413" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="567.5" y="441" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><path d="M607.5 413 L653.5 413" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="625.5" y="441" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="500" y="455" width="87" height="16" rx="5" fill="#b9d4f3" stroke="#91a5bc"/><text x="465" y="469" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><rect x="558" y="477" width="87" height="16" rx="5" fill="#c4e5d5" stroke="#91a5bc"/><text x="465" y="491" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><rect x="616" y="499" width="87" height="16" rx="5" fill="#f5d6a4" stroke="#91a5bc"/><text x="465" y="513" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><rect x="500" y="530" width="203" height="19" rx="5" fill="#e4def6" stroke="#91a5bc"/><text x="500" y="568" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">三个覆盖区域的并集：宽 7（相对原图）</text><rect x="25" y="595" width="1050" height="230" rx="5" fill="#ffffff" stroke="#91a5bc"/><text x="45" y="628" font-size="21" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第 3 层：读取第 2 层的三个位置</text><text x="45" y="670" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层感受野 r=7</text><text x="45" y="703" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">上一层位置间隔 j=4</text><text x="45" y="742" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">r新 = 7 + (3−1)×4 = 15</text><text x="45" y="776" font-size="19" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">j新 = 4×2 = 8</text><circle cx="601.5" cy="658" r="5" fill="#386999"/><text x="594.5" y="644" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><circle cx="717.5" cy="658" r="5" fill="#386999"/><text x="710.5" y="644" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><circle cx="833.5" cy="658" r="5" fill="#386999"/><text x="826.5" y="644" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><path d="M607.5 658 L711.5 658" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="654.5" y="686" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><path d="M723.5 658 L827.5 658" stroke="#526780" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="770.5" y="686" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><rect x="500" y="700" width="203" height="16" rx="5" fill="#b9d4f3" stroke="#91a5bc"/><text x="465" y="714" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A</text><rect x="616" y="722" width="203" height="16" rx="5" fill="#c4e5d5" stroke="#91a5bc"/><text x="465" y="736" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B</text><rect x="732" y="744" width="203" height="16" rx="5" fill="#f5d6a4" stroke="#91a5bc"/><text x="465" y="758" font-size="15" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C</text><rect x="500" y="775" width="435" height="19" rx="5" fill="#e4def6" stroke="#91a5bc"/><text x="500" y="813" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">三个覆盖区域的并集：宽 15（相对原图）</text><text x="35" y="875" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第三层：7 + 4 + 4 = 15；3 个位置只有 2 个间隔，所以不是 7 + 4×4。</text><text x="35" y="905" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">横向和纵向分别计算：1×1 → 3×3 → 7×7 → 15×15。选取远离边界的位置。</text></svg>