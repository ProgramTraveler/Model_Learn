<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">同一验证集逐图比较：修复与新增错误一起看</text><rect x="25" y="70" width="455" height="125" rx="12" fill="#e1f3e9"/><rect x="520" y="70" width="455" height="125" rx="12" fill="#ffedd6"/><text x="45" y="109" font-size="22">G漏判 → S正确</text><text x="45" y="153" font-size="23">修复40张窄道漏判</text><text x="540" y="109" font-size="22">G正确 → S漏判</text><text x="540" y="153" font-size="23">新增15张窄道漏判</text><text x="25" y="235" font-size="22">净减少漏判：40−15＝25张；还需分别检查负类误报变化。</text><text x="25" y="267" font-size="17">教学数字；G/S读取同一冻结特征，分别训练读出器，再用同一验证集评估。</text></g></svg>