<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>激活函数放在哪里：逐元素改变响应</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="380" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">激活函数放在哪里：逐元素改变响应</text><text x="45" y="111" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">卷积输出</text><rect x="45" y="125" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="56.5" y="158.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">-2</text><rect x="95" y="125" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="106.5" y="158.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="45" y="175" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="56.5" y="208.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">0</text><rect x="95" y="175" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="106.5" y="208.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><path d="M150 175 L290 175" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="310" y="125" width="240" height="84" rx="8" fill="#eee7fa" stroke="#96a9be"/><text x="324" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">ReLU</text><text x="324" y="181" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每个数取 max(0,x)</text><path d="M550 175 L685 175" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="710" y="111" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">激活后的特征</text><rect x="710" y="125" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="721.5" y="158.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">0</text><rect x="760" y="125" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="771.5" y="158.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="710" y="175" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="721.5" y="208.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">0</text><rect x="760" y="175" width="50" height="50" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="771.5" y="208.5" font-size="17" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><text x="40" y="300" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">卷积 → 激活 → 卷积 → 激活：让多层特征组合具有非线性。</text><text x="35" y="360" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">本图用 ReLU 举例；激活逐元素计算，保持张量形状。</text></svg>