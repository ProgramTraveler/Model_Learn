<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290"><rect width="1000" height="290" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">2通道教学例子：每个类别读取全部通道、全部区域</text><rect x="25" y="70" width="290" height="145" rx="12" fill="#e3edfc"/><text x="43" y="108" font-size="21">通道1：[a, b, c, d]</text><text x="43" y="150" font-size="21">通道2：[e, f, g, h]</text><text x="43" y="190" font-size="18">平均池化：无可学习参数</text><text x="327" y="144" font-size="24">→</text><rect x="365" y="70" width="275" height="145" rx="12" fill="#e3edfc"/><text x="383" y="108" font-size="22">展平：8个数</text><text x="383" y="150" font-size="19">[a,b,c,d,e,f,g,h]</text><text x="383" y="190" font-size="19">同一向量送入两个输出</text><text x="652" y="144" font-size="24">→</text><rect x="690" y="70" width="285" height="145" rx="12" fill="#e1f3e9"/><text x="708" y="108" font-size="21">非窄道：8个权重＋偏置</text><text x="708" y="150" font-size="21">窄道：另8个权重＋偏置</text><text x="708" y="190" font-size="19">Linear：参数通过训练学习</text><text x="25" y="260" font-size="21">实际1280通道：1280×4＝5120个输入 → 两个类别分数。</text></g></svg>