<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img"><title>第一版候选结构：先用最后一层特征做整图分类</title><rect width="1100" height="450" fill="#f7f9fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><text x="30" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第一版候选结构：先用最后一层特征做整图分类</text><text x="35" y="95" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">结构职责</text><rect x="35.0" y="110" width="231.25" height="90" rx="9" fill="#e3edfc" stroke="#94a7bf"/><text x="48.0" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">一张前方图片</text><text x="48.0" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分辨率尚待确定</text><path d="M266.25 155 L295.25 155" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="301.25" y="110" width="231.25" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bf"/><text x="314.25" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类 backbone</text><text x="314.25" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 C×H×W 特征</text><path d="M532.5 155 L561.5 155" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="567.5" y="110" width="231.25" height="90" rx="9" fill="#fff0da" stroke="#94a7bf"/><text x="580.5" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">全局平均池化</text><text x="580.5" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C 个数</text><path d="M798.75 155 L827.75 155" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="833.75" y="110" width="231.25" height="90" rx="9" fill="#eee7fa" stroke="#94a7bf"/><text x="846.75" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">Linear(C,2)</text><text x="846.75" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个类别分数</text><text x="35" y="245" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">设计假设</text><rect x="35.0" y="260" width="320.0" height="90" rx="9" fill="#e3edfc" stroke="#94a7bf"/><text x="48.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">backbone 形成表示</text><text x="48.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留分类所需线索</text><path d="M355.0 305 L384.0 305" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="390.0" y="260" width="320.0" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bf"/><text x="403.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">平均后仍可区分</text><text x="403.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">窄道与非窄道</text><path d="M710.0 305 L739.0 305" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="745.0" y="260" width="320.0" height="90" rx="9" fill="#fff0da" stroke="#94a7bf"/><text x="758.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">先测基线错误</text><text x="758.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">再决定改哪里</text><text x="35" y="425" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学候选：本次不指定 backbone 型号，不修改代码；全局平均是否合适需验证。</text></svg>