<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250"><rect width="960" height="250" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="30" y="40" font-size="25">共同约定：训练 30 轮，按验证集 F1 最高选存档</text><rect x="30" y="70" width="430" height="100" rx="12" fill="#e3edfc"/><rect x="500" y="70" width="430" height="100" rx="12" fill="#e1f3e9"/><text x="50" y="110" font-size="22">方案 A：全局平均池化</text><text x="50" y="147" font-size="21">最高 F1 在第 18 轮 → 选第 18 轮</text><text x="520" y="110" font-size="22">方案 B：分区平均池化</text><text x="520" y="147" font-size="21">最高 F1 在第 21 轮 → 选第 21 轮</text><text x="30" y="220" font-size="22">选择规则相同，选中轮次可以不同。数字仅作教学示例。</text></g></svg>