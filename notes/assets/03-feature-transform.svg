<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">三个输入通过两套权重形成两个中间特征</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526079"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="35" font-size="22" fill="#172033">特征：对输入进行不同的组合，形成新的表示</text><rect x="25" y="100" width="145" height="110" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="41" y="132" font-size="18" fill="#172033">输入 x</text><text x="41" y="159" font-size="15" fill="#526079">[5, 2, 1]</text><rect x="245" y="70" width="285" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="261" y="102" font-size="18" fill="#172033">h₁ = ReLU(x₁ − x₂)</text><text x="261" y="129" font-size="15" fill="#526079">ReLU(5 − 2) = 3</text><rect x="245" y="210" width="285" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="261" y="242" font-size="18" fill="#172033">h₂ = ReLU(x₂ + x₃)</text><text x="261" y="269" font-size="15" fill="#526079">ReLU(2 + 1) = 3</text><rect x="590" y="140" width="105" height="90" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="606" y="172" font-size="18" fill="#172033">输出 h</text><text x="606" y="199" font-size="15" fill="#526079">[3, 3]</text><path d="M170,135 L245,107" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M170,170 L245,247" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M530,107 L590,165" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M530,247 L590,200" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="345" font-size="17" fill="#172033">每个输出使用自己的权重组合；本图的权重为教学示例。</text><text x="25" y="378" font-size="17" fill="#172033">特征值属于本次输入；模型权重可供不同输入重复使用。</text></g></svg>