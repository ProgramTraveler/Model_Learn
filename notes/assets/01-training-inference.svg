<svg xmlns="http://www.w3.org/2000/svg" width="720" height="395" viewBox="0 0 720 395" role="img" aria-labelledby="title"><title id="title">训练与推理路径以及参数更新</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526079"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="22" fill="#172033">同一个模型：训练会更新参数，推理使用已有参数</text><rect x="30" y="85" width="135" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="46" y="117" font-size="18" fill="#172033">输入 x</text><text x="46" y="144" font-size="15" fill="#526079">训练样本</text><rect x="230" y="85" width="210" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="246" y="117" font-size="18" fill="#172033">模型 f(x; θ)</text><text x="246" y="144" font-size="15" fill="#526079">θ：权重、偏置</text><rect x="505" y="85" width="170" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="521" y="117" font-size="18" fill="#172033">预测结果</text><text x="521" y="144" font-size="15" fill="#526079">前向计算</text><rect x="505" y="235" width="170" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="521" y="267" font-size="18" fill="#172033">损失函数</text><text x="521" y="294" font-size="15" fill="#526079">与标签比较</text><rect x="230" y="235" width="210" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="246" y="267" font-size="18" fill="#172033">参数更新</text><text x="246" y="294" font-size="15" fill="#526079">根据梯度调整 θ</text><rect x="30" y="235" width="135" height="76" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="46" y="267" font-size="18" fill="#172033">标签</text><text x="46" y="294" font-size="15" fill="#526079">正确答案</text><path d="M165,123 L230,123" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,123 L505,123" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M590,161 L590,235" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M165,273 L190,273 L190,333 L700,333 L700,273 L675,273" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M505,292 L440,292" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M335,235 L335,161" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="365" font-size="17" fill="#172033">推理路径：输入 → 模型 → 预测；通常不执行参数更新。</text></g></svg>