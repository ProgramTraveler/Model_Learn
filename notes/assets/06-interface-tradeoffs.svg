<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>读接口后的三种设计问题</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="380" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">读接口后的三种设计问题</text><rect x="35" y="105" width="320" height="111" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道 C</text><text x="49" y="161" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">增加表示数量</text><text x="49" y="188" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">也增加存储与计算</text><rect x="385" y="105" width="320" height="111" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="399" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">空间 H×W</text><text x="399" y="161" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留更多位置</text><text x="399" y="188" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">后续处理成本更高</text><rect x="735" y="105" width="320" height="111" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="749" y="134" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">感受野</text><text x="749" y="161" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">允许更大范围组合</text><text x="749" y="188" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">不保证实际充分利用</text><rect x="160" y="255" width="780" height="57" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="174" y="284" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">结合间隙细节、布局信息和部署约束，提出候选结构，再用实验判断。</text><text x="35" y="360" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">这些量是分析依据，任何单个量都不能证明分类效果更好。</text></svg>