<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310"><rect width="960" height="310" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">三次训练都记录，再看平均值与变化范围</text><rect x="25" y="65" width="430" height="165" rx="12" fill="#e3edfc"/><rect x="500" y="65" width="430" height="165" rx="12" fill="#e1f3e9"/><text x="45" y="103" font-size="23">方案 A：漏判数</text><text x="45" y="145" font-size="24">280　270　290</text><text x="45" y="192" font-size="21">平均 280；范围 270～290</text><text x="520" y="103" font-size="23">方案 B：漏判数</text><text x="520" y="145" font-size="24">250　255　245</text><text x="520" y="192" font-size="21">平均 250；范围 245～255</text><text x="25" y="275" font-size="21">教学示例：同一验证集；平均值概括表现，不对应一份实际存档。</text></g></svg>