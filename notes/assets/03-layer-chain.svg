<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><rect width="1100" height="310" fill="#f7f9fc"/><text x="30" y="42" font-family="PingFang SC,sans-serif" font-size="25" fill="#20324c">多层前向计算：上一层输出成为下一层输入</text><rect x="25" y="90" width="240" height="125" rx="10" fill="#e3edfc" stroke="#94a7bf"/><text x="37" y="122" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">输入</text><text x="37" y="160" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">3 个输入数值</text><text x="37" y="195" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">形状 [3]</text><text x="270" y="165" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">→</text><rect x="300" y="90" width="240" height="125" rx="10" fill="#e3edfc" stroke="#94a7bf"/><text x="312" y="122" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">隐藏层 1</text><text x="312" y="160" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">Linear(3,4) + ReLU</text><text x="312" y="195" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">输出 [4]</text><text x="545" y="165" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">→</text><rect x="575" y="90" width="240" height="125" rx="10" fill="#e3edfc" stroke="#94a7bf"/><text x="587" y="122" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">隐藏层 2</text><text x="587" y="160" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">Linear(4,2) + ReLU</text><text x="587" y="195" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">输出 [2]</text><text x="820" y="165" font-family="PingFang SC,sans-serif" font-size="23" fill="#20324c">→</text><rect x="850" y="90" width="240" height="125" rx="10" fill="#e3edfc" stroke="#94a7bf"/><text x="862" y="122" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">输出层</text><text x="862" y="160" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">Linear(2,2)</text><text x="862" y="195" font-family="PingFang SC,sans-serif" font-size="17" fill="#20324c">两个类别分数 [2]</text><text x="30" y="265" font-family="PingFang SC,sans-serif" font-size="19" fill="#20324c">接口：3 → 4 → 2 → 2；各全连接层有自己的参数。隐藏层宽度无需等于类别数。</text></svg>