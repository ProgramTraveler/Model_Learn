<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" fill="#f7f9fc"/><g font-family="PingFang SC, sans-serif" fill="#20324c"><text x="24" y="38" font-size="24">相同输入 [B,C,H,W]：选择分类前保留什么</text><text x="24" y="92" font-size="19">全局平均</text><text x="300" y="92" font-size="19">整体平均响应</text><text x="590" y="92" font-size="19">[B,C,1,1] → C 个数</text><text x="24" y="159" font-size="19">全局最大</text><text x="300" y="159" font-size="19">每通道最强响应</text><text x="590" y="159" font-size="19">[B,C,1,1] → C 个数</text><text x="24" y="226" font-size="19">分区平均（2×2）</text><text x="300" y="226" font-size="19">四个区域分别汇总</text><text x="590" y="226" font-size="19">[B,C,2,2] → 4C 个数</text><text x="24" y="299" font-size="17">示例：C=1280；展平后接 Linear(1280,2) 或 Linear(5120,2)。效果需对照验证。</text></g></svg>