<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255" viewBox="0 0 1000 255"><rect width="1000" height="255" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">先找重复错误模式，再选择结构候选</text><rect x="25" y="70" width="290" height="110" rx="12" fill="#e3edfc"/><rect x="355" y="70" width="290" height="110" rx="12" fill="#e3edfc"/><rect x="685" y="70" width="290" height="110" rx="12" fill="#e1f3e9"/><text x="43" y="110" font-size="21">观察：局部线索相似</text><text x="43" y="150" font-size="20">布局不同，反复混淆</text><text x="323" y="134" font-size="23">→</text><text x="373" y="110" font-size="21">假设：保留粗略分区</text><text x="373" y="150" font-size="20">可能帮助区分两类</text><text x="653" y="134" font-size="23">→</text><text x="703" y="110" font-size="21">验证：分别训练A/B</text><text x="703" y="150" font-size="20">看子集、总体与成本</text><text x="25" y="227" font-size="21">原图的布局差异支持提出假设，不能直接证明池化就是错误原因。</text></g></svg>