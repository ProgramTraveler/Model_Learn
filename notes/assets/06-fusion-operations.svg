<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img"><title>先对齐，再区分相加与沿通道拼接</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#516178"/></marker></defs><rect width="1100" height="640" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">先对齐，再区分相加与沿通道拼接</text><text x="40" y="110" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">A：1×2×2</text><rect x="40" y="125" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="52" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="84" y="125" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="96" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="40" y="169" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="52" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="84" y="169" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="96" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><text x="270" y="110" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B：1×1×1</text><rect x="270" y="125" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="282" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><path d="M330 150 L430 150" fill="none" stroke="#516178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="115" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">最近邻上采样</text><text x="460" y="110" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">B′：1×2×2</text><rect x="460" y="125" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="472" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="504" y="125" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="516" y="154" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="460" y="169" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="472" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="504" y="169" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="516" y="198" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><text x="650" y="140" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">重复已有数值</text><text x="650" y="180" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">没有恢复新细节</text><text x="40" y="335" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加：A+B′</text><rect x="40" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="52" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">11</text><rect x="84" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="96" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">12</text><rect x="40" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="52" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">13</text><rect x="84" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="96" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">14</text><rect x="195" y="340" width="295" height="110" rx="12" fill="#e4f3ed" stroke="#94a7bd"/><text x="210" y="369" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 1×2×2</text><text x="210" y="396" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">对应格子合成一个数</text><text x="210" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道数保持不变</text><text x="570" y="335" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">拼接：通道 1</text><rect x="570" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="582" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">1</text><rect x="614" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="626" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">2</text><rect x="570" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="582" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">3</text><rect x="614" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="626" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">4</text><text x="760" y="335" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">通道 2</text><rect x="760" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="772" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="804" y="350" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="816" y="379" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="760" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="772" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><rect x="804" y="394" width="44" height="44" fill="#e0edff" stroke="#91a5bf"/><text x="816" y="423" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">10</text><text x="570" y="485" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出 2×2×2：保留两张表，共 8 个数</text><rect x="35" y="535" width="1030" height="75" rx="12" fill="#e6eefb" stroke="#94a7bd"/><text x="50" y="564" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">相加：C、H、W 都需匹配；通道拼接：H、W 需匹配，输出通道数为 C₁+C₂。</text><text x="50" y="591" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">两种方式均需检查空间坐标对应；拼接不是把两张表左右接宽。</text></svg>