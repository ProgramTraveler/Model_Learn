<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="24">同一组随机种子，分别训练 A 与 B</text><rect x="25" y="60" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="89" font-size="19">种子 1：A₁ 与 B₁ → 按统一规则各选 checkpoint</text><rect x="25" y="117" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="146" font-size="19">种子 2：A₂ 与 B₂ → 比较漏判、误报与成本</text><rect x="25" y="174" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="203" font-size="19">种子 3：A₃ 与 B₃ → 检查收益方向和波动</text><rect x="25" y="231" width="950" height="45" rx="8" fill="#e3edfc"/><text x="40" y="260" font-size="19">三次只是试验起点，不是证明有效的固定次数</text></g></svg>