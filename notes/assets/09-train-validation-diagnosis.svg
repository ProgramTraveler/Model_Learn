<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405"><rect width="1120" height="405" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="35" font-size="24">从可比评估到 head 改动</text><rect x="25" y="55" width="1070" height="45" rx="7" fill="#e3edfc"/><text x="38" y="84" font-size="18">同一个 checkpoint：eval 模式、关闭随机增强、相同评估预处理与 argmax</text><rect x="25" y="110" width="1070" height="45" rx="7" fill="#e1f2eb"/><text x="38" y="139" font-size="18">评估训练集：学过的样本掌握怎样？     评估验证集：未用于梯度训练的样本怎样？</text><rect x="25" y="165" width="1070" height="45" rx="7" fill="#e3edfc"/><text x="38" y="194" font-size="18">训练与验证都差 → 先排查训练、标签，再提出表示或 head 能力假设</text><rect x="25" y="220" width="1070" height="45" rx="7" fill="#e1f2eb"/><text x="38" y="249" font-size="18">训练好、验证差 → 检查数据分布和覆盖，再比较正则化或较小 head</text><rect x="25" y="275" width="1070" height="45" rx="7" fill="#e3edfc"/><text x="38" y="304" font-size="18">按暗光、细小间隙等分组 → 同时记录样本量、漏判和误报</text><rect x="25" y="330" width="1070" height="45" rx="7" fill="#e1f2eb"/><text x="38" y="359" font-size="18">形成一个可检验假设 → 一次改一项 → 分别训练 → 同规则比较</text></g></svg>