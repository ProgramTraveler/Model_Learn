<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><rect width="1000" height="250" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="40" font-size="25">判断候选：先过约束，再比较收益</text><rect x="25" y="75" width="290" height="100" rx="12" fill="#e3edfc"/><rect x="355" y="75" width="290" height="100" rx="12" fill="#e3edfc"/><rect x="685" y="75" width="290" height="100" rx="12" fill="#e1f3e9"/><text x="43" y="112" font-size="22">① 是否满足硬约束？</text><text x="43" y="149" font-size="19">误报、时延等预设上限</text><text x="322" y="132" font-size="24">→</text><text x="373" y="112" font-size="22">② 收益是否可靠？</text><text x="373" y="149" font-size="19">主要指标、波动、场景</text><text x="652" y="132" font-size="24">→</text><text x="703" y="112" font-size="22">③ 决定下一步</text><text x="703" y="149" font-size="19">继续验证、暂留或淘汰</text><text x="25" y="220" font-size="21">没有明确约束时，记录取舍与待确认条件，不替业务设定上限。</text></g></svg>