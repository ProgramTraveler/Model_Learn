<svg xmlns="http://www.w3.org/2000/svg" width="980" height="275" viewBox="0 0 980 275"><rect width="980" height="275" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">局部响应换了位置：分区表示随之变化</text><rect x="25" y="65" width="435" height="125" rx="12" fill="#e3edfc"/><rect x="520" y="65" width="435" height="125" rx="12" fill="#e1f3e9"/><text x="45" y="101" font-size="22">响应在左上</text><text x="45" y="140" font-size="23">分区向量：[8, 0, 0, 0]</text><text x="45" y="173" font-size="19">全局均值：2</text><text x="477" y="135" font-size="25">→</text><text x="540" y="101" font-size="22">响应移到右上</text><text x="540" y="140" font-size="23">分区向量：[0, 8, 0, 0]</text><text x="540" y="173" font-size="19">全局均值：2</text><text x="25" y="235" font-size="21">保留位置可能帮助分类，也需检查视角变化时能否保持正确判断。</text></g></svg>