<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450"><rect width="1100" height="450" fill="#f7f9fc"/><text x="30" y="42" font-family="PingFang SC, sans-serif" font-size="26" fill="#20324c">隐藏层是计算环节，h₁、h₂ 是本次计算的输出</text><rect x="30" y="110" width="210" height="170" rx="12" fill="#e3edfc" stroke="#94a7bf"/><rect x="280" y="80" width="510" height="250" rx="12" fill="#e3edfc" stroke="#94a7bf"/><rect x="830" y="110" width="240" height="170" rx="12" fill="#e3edfc" stroke="#94a7bf"/><text x="50" y="150" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">当前层输入 x</text><text x="50" y="200" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">[5, 2, 1]</text><text x="300" y="120" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">隐藏层：全连接变换 → ReLU</text><text x="300" y="170" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">单元 1：h₁ = ReLU(x₁ − x₂) = 3</text><text x="300" y="215" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">单元 2：h₂ = ReLU(x₂ + x₃) = 3</text><text x="300" y="275" font-family="PingFang SC, sans-serif" font-size="18" fill="#20324c">权重、偏置是参数；公式规定计算</text><text x="850" y="150" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">隐藏层输出 h</text><text x="850" y="195" font-family="PingFang SC, sans-serif" font-size="20" fill="#20324c">[h₁, h₂] = [3, 3]</text><text x="850" y="240" font-family="PingFang SC, sans-serif" font-size="17" fill="#20324c">交给后续层继续计算</text><text x="248" y="205" font-family="PingFang SC, sans-serif" font-size="26" fill="#20324c">→</text><text x="797" y="205" font-family="PingFang SC, sans-serif" font-size="26" fill="#20324c">→</text><text x="30" y="380" font-family="PingFang SC, sans-serif" font-size="21" fill="#20324c">同一组 [3,3]：按来源叫“隐藏层输出”，按用途叫“中间表示 / 特征”。</text><text x="30" y="420" font-family="PingFang SC, sans-serif" font-size="18" fill="#20324c">教学假设：权重手动指定、偏置为 0；没有证明这些特征对实际分类有用。</text></svg>