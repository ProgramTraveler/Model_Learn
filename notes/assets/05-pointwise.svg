<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300"><rect width="960" height="300" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="40" font-size="25">1×1 卷积：同一位置，跨通道加权组合</text><text x="35" y="95" font-size="22">通道 1：5 × 权重 1 = 5</text><text x="35" y="145" font-size="22">通道 2：2 × 权重 2 = 4</text><text x="35" y="195" font-size="22">通道 3：1 × 权重 −1 = −1</text><text x="560" y="142" font-size="24">求和 + 偏置 0 → 输出 8</text><text x="25" y="258" font-size="20">假设：普通卷积、stride=1、padding=0；每套过滤器有 3 个权重。</text></g><g stroke="#2875bd" stroke-width="3" fill="none"><path d="M370 88 L470 140 L535 140 M370 140 L470 140 M370 190 L470 140"/></g></svg>