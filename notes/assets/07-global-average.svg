<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><rect width="980" height="350" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="35" font-size="23">全局平均池化：每个通道单独求平均</text><rect x="35" y="70" width="240" height="180" rx="10" fill="#e3edfc"/><text x="55" y="102" font-size="20">通道 A：2×2</text><text x="100" y="150" font-size="24">1　3</text><text x="100" y="195" font-size="24">5　7</text><rect x="350" y="70" width="240" height="180" rx="10" fill="#fff0da"/><text x="370" y="102" font-size="20">另一种排列：2×2</text><text x="415" y="150" font-size="24">7　5</text><text x="415" y="195" font-size="24">3　1</text><path d="M275 160 H325 M590 160 H640" stroke="#2875bd" stroke-width="3"/><text x="285" y="145" font-size="17">均值 4</text><rect x="660" y="90" width="285" height="140" rx="10" fill="#e1f2eb"/><text x="680" y="130" font-size="20">两种排列都得到 4</text><text x="680" y="170" font-size="18">平均后无法区分排列</text><text x="25" y="285" font-size="19">实际 Head：1280 张 H×W 表 → 各自求平均 → 1280 个数 → Linear → 2 个分数</text><text x="25" y="323" font-size="16">数值是教学示例；平均可能丢失布局，但平均之前的通道响应也可能已编码关系信息。</text></g></svg>