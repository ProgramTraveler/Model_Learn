<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="320" viewBox="0 0 1060 320"><rect width="1060" height="320" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="37" font-size="23">先看错在哪里，再提出 Head 改动假设</text><rect x="25" y="80" width="270" height="140" rx="10" fill="#e3edfc"/><text x="40" y="115" font-size="21">验证集错误样本</text><text x="40" y="155" font-size="18">漏判：窄道 → 非窄道</text><text x="40" y="190" font-size="18">误报：非窄道 → 窄道</text><text x="307" y="157" font-size="25">→</text><rect x="350" y="80" width="290" height="140" rx="10" fill="#fff0da"/><text x="365" y="115" font-size="21">核对标签、归纳场景</text><text x="365" y="155" font-size="18">细小间隙？暗光？新地点？</text><text x="365" y="190" font-size="18">同时比较同类正确样本</text><text x="653" y="157" font-size="25">→</text><rect x="695" y="80" width="340" height="140" rx="10" fill="#e1f2eb"/><text x="710" y="115" font-size="21">提出一个可检验假设</text><text x="710" y="155" font-size="18">例如：P5 的细节表示不足？</text><text x="710" y="190" font-size="18">候选：同类 Head 改用 P4</text><text x="25" y="275" font-size="18">错误现象只是线索，不足以证明原因；冻结共享模块，分别训练并比较候选。</text><text x="25" y="305" font-size="16">教学示例，不是当前模型实际错误统计；真实标签和业务约束须结合数据核对。</text></g></svg>