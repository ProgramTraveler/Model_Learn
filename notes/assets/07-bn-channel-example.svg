<svg xmlns="http://www.w3.org/2000/svg" width="850" height="490" viewBox="0 0 850 490"><rect width="850" height="490" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="28" y="38" font-size="23">训练中的 BatchNorm2d：只看其中一个特征通道</text><text x="28" y="83" font-size="21">图片 A，该通道：       图片 B，该通道：</text><text x="28" y="128" font-size="21">  1    3                      1    3</text><text x="28" y="173" font-size="21">  1    3                      1    3</text><text x="28" y="218" font-size="21">同一批次、同一通道的 8 个数一起统计</text><text x="28" y="263" font-size="21">均值 μ=2；用于当前归一化的方差=1</text><text x="28" y="308" font-size="21">标准化：(x−2) / √(1+ε)</text><text x="28" y="353" font-size="21">约变为：1 → −1；3 → 1</text><text x="28" y="398" font-size="21">随后：输出 = γ × 标准化结果 + β</text><text x="28" y="443" font-size="21">其他通道各算各的均值、方差，并使用各自的 γ、β。</text></g></svg>