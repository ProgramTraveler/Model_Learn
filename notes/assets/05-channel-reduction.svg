<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340"><rect width="1100" height="340" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="40" font-size="25">先组合通道，再进行空间卷积</text><text x="25" y="100" font-size="22">A：128×H×W → 3×3 卷积 → 64×H×W</text><text x="65" y="140" font-size="20">权重：64×128×3×3 = 73,728</text><text x="25" y="200" font-size="22">B：128×H×W → 1×1 卷积 → 32×H×W → 3×3 卷积 → 64×H×W</text><text x="65" y="240" font-size="20">权重：32×128 + 64×32×3×3 = 4,096 + 18,432 = 22,528</text><text x="25" y="286" font-size="18">假设：普通卷积；stride=1；1×1 不填充，3×3 每侧填充 1；不计偏置。</text><text x="25" y="317" font-size="18">两种输出形状相同，计算过程和表达能力不同；减少权重不保证任务效果相同。</text></g></svg>