<svg xmlns="http://www.w3.org/2000/svg" width="720" height="425" viewBox="0 0 720 425" role="img" aria-labelledby="title"><title id="title">多层仿射变换与非线性激活对比</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526079"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="24" y="35" font-size="22" fill="#172033">没有非线性：多层仿射变换仍可合并</text><rect x="25" y="65" width="150" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="41" y="97" font-size="18" fill="#172033">输入 x</text><rect x="220" y="65" width="200" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="236" y="97" font-size="18" fill="#172033">h = W₁x + b₁</text><rect x="465" y="65" width="230" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="481" y="97" font-size="18" fill="#172033">y = W₂h + b₂</text><path d="M175,102 L220,102" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M420,102 L465,102" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="185" font-size="21" fill="#172033">合并：y = (W₂W₁)x + (W₂b₁ + b₂)</text><text x="24" y="240" font-size="22" fill="#172033">加入 ReLU：不同输入区域可以有不同的表达式</text><rect x="25" y="270" width="190" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="41" y="302" font-size="18" fill="#172033">h = 2x + 1</text><rect x="260" y="270" width="180" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="276" y="302" font-size="18" fill="#172033">a = max(0, h)</text><rect x="485" y="270" width="210" height="75" rx="10" fill="#eff6ff" stroke="#b8cdf5"/><text x="501" y="302" font-size="18" fill="#172033">y = 3a + 4</text><path d="M215,307 L260,307" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,307 L485,307" fill="none" stroke="#526079" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="385" font-size="20" fill="#172033">x ≤ −0.5：y = 4</text><text x="350" y="385" font-size="20" fill="#172033">x &gt; −0.5：y = 6x + 7</text></g></svg>