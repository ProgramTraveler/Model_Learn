<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img"><title>基线的作用：给后续改动一个可比较的起点</title><rect width="1100" height="450" fill="#f7f9fc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><text x="30" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">基线的作用：给后续改动一个可比较的起点</text><text x="35" y="95" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">先建立基线</text><rect x="35.0" y="110" width="320.0" height="90" rx="9" fill="#e3edfc" stroke="#94a7bf"/><text x="48.0" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">固定数据划分</text><text x="48.0" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">按序列或地点隔离</text><path d="M355.0 155 L384.0 155" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="390.0" y="110" width="320.0" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bf"/><text x="403.0" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">第一版分类结构</text><text x="403.0" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">合理训练</text><path d="M710.0 155 L739.0 155" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="745.0" y="110" width="320.0" height="90" rx="9" fill="#fff0da" stroke="#94a7bf"/><text x="758.0" y="140" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">记录效果与成本</text><text x="758.0" y="167" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">召回、误报、实测耗时</text><text x="35" y="245" font-size="20" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">再检验一个改动</text><rect x="35.0" y="260" width="320.0" height="90" rx="9" fill="#e3edfc" stroke="#94a7bf"/><text x="48.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">保持评估条件一致</text><text x="48.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">训练策略合理可比</text><path d="M355.0 305 L384.0 305" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="390.0" y="260" width="320.0" height="90" rx="9" fill="#e1f2eb" stroke="#94a7bf"/><text x="403.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">加入一个候选改动</text><text x="403.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">例如多层融合</text><path d="M710.0 305 L739.0 305" stroke="#526780" stroke-width="2.2" marker-end="url(#a)"/><rect x="745.0" y="260" width="320.0" height="90" rx="9" fill="#fff0da" stroke="#94a7bf"/><text x="758.0" y="290" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">与基线对比</text><text x="758.0" y="317" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">判断收益是否值得</text><text x="35" y="425" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">这是待执行的验证路线；简单结构不是必须更好，复杂结构也不是默认更好。</text></svg>