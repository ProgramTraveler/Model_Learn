<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285"><rect width="1000" height="285" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="38" font-size="25">输入已经相同，后面的MLP无法再辨别原来的布局</text><rect x="25" y="70" width="285" height="130" rx="12" fill="#e3edfc"/><text x="43" y="108" font-size="21">A：上排8、下排0</text><text x="43" y="150" font-size="21">B：上排0、下排8</text><text x="43" y="183" font-size="18">单通道教学例子</text><text x="320" y="139" font-size="24">→</text><rect x="360" y="70" width="285" height="130" rx="12" fill="#e3edfc"/><text x="378" y="108" font-size="22">全局平均</text><text x="378" y="153" font-size="24">A → 4；B → 4</text><text x="655" y="139" font-size="24">→</text><rect x="695" y="70" width="280" height="130" rx="12" fill="#e1f3e9"/><text x="713" y="108" font-size="22">同一MLP评估</text><text x="713" y="153" font-size="22">f(4) 与 f(4) 相同</text><text x="25" y="248" font-size="20">真实多通道：只有完整输入向量相同，才有上述必然相同的结论。</text></g></svg>