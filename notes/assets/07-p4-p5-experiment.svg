<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="350" viewBox="0 0 1060 350"><rect width="1060" height="350" fill="#f7f9fc"/><g font-family="PingFang SC,sans-serif" fill="#20324c"><text x="25" y="36" font-size="23">单尺度对照：只改变 Head 读取的特征层级</text><rect x="25" y="65" width="1010" height="55" rx="9" fill="#e3edfc"/><text x="45" y="100" font-size="19">共同条件：相同冻结权重、数据划分、预处理、训练方案与评价规则</text><rect x="25" y="145" width="480" height="105" rx="9" fill="#e1f2eb"/><text x="45" y="180" font-size="21">A：读取 P5</text><text x="45" y="220" font-size="18">1×1 模块 → 全局平均 → Linear</text><rect x="555" y="145" width="480" height="105" rx="9" fill="#fff0da"/><text x="575" y="180" font-size="21">B：读取 P4</text><text x="575" y="220" font-size="18">相同 Head 配置，独立训练</text><text x="25" y="290" font-size="19">比较：漏判、误报、细小间隙子集表现，以及计算成本</text><text x="25" y="325" font-size="16">先核对实际输出键及形状；层级改变也会改变表示内容，结果不能只归因于分辨率。</text></g></svg>