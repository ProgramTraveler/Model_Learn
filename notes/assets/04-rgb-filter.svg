<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img"><title>04-rgb-filter</title><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="25" y="35" font-size="23" fill="#172033">普通卷积：三个输入通道汇合成一个输出通道</text><rect x="25" y="75" width="175" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="40" y="102" font-size="18" fill="#172033">R：3×3 输入窗口</text><text x="40" y="126" font-size="15" fill="#172033">9 个输入数值</text><text x="210" y="114" font-size="24" fill="#172033">→</text><rect x="250" y="75" width="240" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="265" y="102" font-size="18" fill="#172033">R 对应的 3×3 权重</text><text x="265" y="126" font-size="16" fill="#172033">逐项乘加结果：2</text><path d="M490,107 L535,107 L535,207 L570,207" fill="none" stroke="#526079" stroke-width="2"/><rect x="25" y="175" width="175" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="40" y="202" font-size="18" fill="#172033">G：3×3 输入窗口</text><text x="40" y="226" font-size="15" fill="#172033">9 个输入数值</text><text x="210" y="214" font-size="24" fill="#172033">→</text><rect x="250" y="175" width="240" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="265" y="202" font-size="18" fill="#172033">G 对应的 3×3 权重</text><text x="265" y="226" font-size="16" fill="#172033">逐项乘加结果：-1</text><path d="M490,207 L535,207 L535,207 L570,207" fill="none" stroke="#526079" stroke-width="2"/><rect x="25" y="275" width="175" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="40" y="302" font-size="18" fill="#172033">B：3×3 输入窗口</text><text x="40" y="326" font-size="15" fill="#172033">9 个输入数值</text><text x="210" y="314" font-size="24" fill="#172033">→</text><rect x="250" y="275" width="240" height="65" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="265" y="302" font-size="18" fill="#172033">B 对应的 3×3 权重</text><text x="265" y="326" font-size="16" fill="#172033">逐项乘加结果：4</text><path d="M490,307 L535,307 L535,207 L570,207" fill="none" stroke="#526079" stroke-width="2"/><rect x="570" y="165" width="165" height="100" rx="5" fill="#eff6ff" stroke="#cbd5e1"/><text x="583" y="194" font-size="18" fill="#172033">求和，再加偏置</text><text x="583" y="224" font-size="18" fill="#172033">2 − 1 + 4 + 1</text><text x="583" y="249" font-size="18" fill="#172033">= 6</text><text x="25" y="405" font-size="19" fill="#172033">一套过滤器：3×3×3 = 27 个权重 + 1 个偏置。</text><text x="25" y="445" font-size="18" fill="#172033">32 套不同过滤器 → 32 张输出特征图，每套都读取 RGB 三通道。</text><text x="25" y="485" font-size="16" fill="#172033">图中数值为教学示例。偏置对每个输出通道只加一次。</text></g></svg>