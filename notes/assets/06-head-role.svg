<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img"><title>分类 head：特征怎样变成两个类别分数</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526780"/></marker></defs><rect width="1100" height="300" fill="#f7f9fc"/><text x="35" y="42" font-size="25" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类 head：特征怎样变成两个类别分数</text><rect x="35.0" y="95" width="235.0" height="110" rx="8" fill="#e3edfc" stroke="#96a9be"/><text x="49.0" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">特征</text><text x="49.0" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">C 张 H×W 数值表</text><path d="M270.0 150 L295.0 150" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="300.0" y="95" width="235.0" height="110" rx="8" fill="#e1f2eb" stroke="#96a9be"/><text x="314.0" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">空间汇总</text><text x="314.0" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">每张表 → 一个数</text><path d="M535.0 150 L560.0 150" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="565.0" y="95" width="235.0" height="110" rx="8" fill="#fff0da" stroke="#96a9be"/><text x="579.0" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类层</text><text x="579.0" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">组合 C 个数</text><path d="M800.0 150 L825.0 150" stroke="#526780" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="830.0" y="95" width="235.0" height="110" rx="8" fill="#eee7fa" stroke="#96a9be"/><text x="844.0" y="124" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">任务输出</text><text x="844.0" y="151" font-size="18" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">窄道、非窄道分数</text><text x="35" y="280" font-size="16" fill="#20324c" font-family="PingFang SC,Microsoft YaHei,sans-serif">本图采用全局平均方案；原始类别分数不是概率，也不是两个空间位置。</text></svg>